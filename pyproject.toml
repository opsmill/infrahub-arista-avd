[project]
name = "solution-arista-avd"
version = "0.1.0"
description = "Arista AVD reference design for Infrahub: models datacenter fabric intent, EVPN services, and per-device AVD data, then renders EOS configurations and documentation through PyAVD."
authors = [{ name = "OpsMill", email = "info@opsmill.com" }]
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyavd>=6.3.0,<6.4.0",
    "streamlit-flow-component>=1.6.1",
]

[dependency-groups]
dev = [
    "infrahub-sdk[all]>=1.19.0",
    "infrahub-testcontainers>=1.3.0",
    "invoke>=2.2.0",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
    "rumdl>=0.2.54",
    "yamllint>=1.37.1",
]
catalog = [
    "streamlit>=1.30.0",
    "infrahub-sdk>=1.19.0,<2.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "class"
testpaths = ["tests"]
markers = [
    "e2e: full-stack end-to-end pipeline test (heavy testcontainer stack; run with -m e2e, exclude with -m 'not e2e')",
]

[tool.rumdl]
# NOTE: rules are disabled through this list, not with `MD013 = false`. The
# per-rule-false form parses without complaint and has no effect.
#   MD013 - line length: too strict for prose and long command examples.
#   MD033 - inline HTML: needed for MDX and Docusaurus admonitions.
#   MD041 - first line heading: pages start with frontmatter.
disable = ["MD013", "MD033", "MD041"]

exclude = [
    # Vendored agent tooling; authored upstream, not by this project.
    ".agents",
    ".claude",
    ".specify",
    ".superset",
    # Spec-kit process artifacts, rewritten by the /speckit-* commands.
    "specs",
    # Rendered by PyAVD (device docs, fabric docs, ANTA reports). Regenerated on
    # deploy, so lint fixes here would be overwritten - same reasoning as the
    # lab/avd/intended entry in .yamllint.yml.
    "lab/avd",
    # Symlink to AGENTS.md; linting both reports every finding twice.
    "CLAUDE.md",
    "node_modules",
    ".venv",
]

[tool.rumdl.MD025]
# Docusaurus pages carry both a frontmatter `title:` and an H1. rumdl counts the
# frontmatter title as a top-level heading by default, so every page trips
# MD025. Clearing this decouples the two; the alternative auto-fix would delete
# the H1s and change heading anchors.
front-matter-title = ""

[tool.mypy]
pretty = true
ignore_missing_imports = true
disallow_untyped_defs = true

# protocols.py is generated by `infrahubctl protocols`; its Optional-vs-base
# attribute overrides are codegen artifacts, not something to hand-fix.
[[tool.mypy.overrides]]
module = "solution_arista_avd.protocols"
ignore_errors = true

[tool.ruff]
line-length = 120

exclude = [
    ".git",
    ".tox",
    ".venv",
    "env",
    "_build",
    "build",
    "dist",
    "examples",
    "service_catalog", # auxiliary Streamlit app (separate `catalog` dependency group), not part of the core solution
    "generators/*_query.py", # generated by `infrahubctl graphql generate-return-types`; do not hand-lint
    "src/solution_arista_avd/protocols.py", # generated by `infrahubctl protocols`; do not hand-lint (it re-exports the full SDK protocol surface)
    # Generated by `infrahubctl graphql generate-return-types`; do not hand-lint.
    # Listed individually rather than as `**/*_query.py`: that glob also caught
    # transforms/containerlab_topology_query.py, which is hand-written and so
    # should be linted like any other source file.
    "checks/*_query.py",
    "transforms/avd_anta_catalog_query.py",
    "transforms/containerlab_link_endpoints_query.py",
    "transforms/avd_device_config_query.py",
    "transforms/avd_fabric_devices_query.py",
    "transforms/computed_interface_description_query.py",
    "transforms/cv_workspace_submission_webhook_query.py",
    "transforms/fabric_cabling_plan_query.py",
]


[tool.ruff.lint]
preview = true

task-tags = ["FIXME", "TODO", "XXX"]

select = ["ALL"]

ignore = [
    "D",      # pydocstyle
    "DOC",    # pydoclint
    "CPY",    # flake8-copyright
    "T201",   # use of `print`
    "ISC",    # flake8-implicit-str-concat
    "COM812", # missing-trailing-comma

    "PT",
    "ERA001", # commented-out code
    "S101",   # use of assert
    "PLR6301",
    "PLW0717", # too-many-statements-in-try-clause — unstable Pylint preview rule, not enforced
    "FBT",
    "G004",   # Logging statement uses f-string
    "PLR",

    # Exception-message style: the codebase favours inline messages over the
    # assign-to-variable / subclass pattern these rules enforce.
    "TRY003", # long messages outside the exception class
    "TRY300", # statement could move to an `else` block
    "EM101",  # exception uses a string literal
    "EM102",  # exception uses an f-string literal
    "PLC0415", # `import` not at top-level — generators import heavy/optional deps lazily on purpose
    "ANN401",  # dynamically-typed `Any` is used deliberately when bridging GraphQL/AVD payloads
]

[tool.ruff.lint.per-file-ignores]
# Standalone operational scripts are run directly (not imported as a package)
# and manipulate sys.path before importing the solution package.
"scripts/*.py" = ["INP001"]
# Tests legitimately reach into private members and use local imports / unused
# fixture arguments; return-type annotations add no value here.
"tests/**/*.py" = ["SLF001", "ARG001", "ARG002", "ANN201", "RUF029", "E501"]
# CloudVision integration uses pyavd._cv internals (no public API exists).
"checks/cv_*.py" = ["PLC2701", "SLF001", "PLW0717"]
"generators/submit_cv_workspace.py" = ["PLC2701", "PLW0717"]


#https://docs.astral.sh/ruff/formatter/black/
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["solution_arista_avd"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.mccabe]
# Target max-complexity=10
max-complexity = 17


[tool.uv]
override-dependencies = [
    "ariadne-codegen>=0.17.1",
    "click>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
