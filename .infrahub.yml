---
#schemas:
#  - schemas

menus:
  - menus/menu.yml

queries:
  - name: generate_fabric
    file_path: "./generators/generate_fabric.gql"

  - name: generate_pod
    file_path: "./generators/generate_pod.gql"

  - name: generate_rack
    file_path: "./generators/generate_rack.gql"

  - name: network_device_startup_config
    file_path: "./transforms/startup_config.gql"

  - name: computed_interface_description
    file_path: "./transforms/computed_interface_description.gql"

  - name: cabling_plan
    file_path: "./transforms/cabling_plan.gql"

  # AVD Generator queries
  - name: generate_avd_inputs
    file_path: "./generators/generate_avd_inputs.gql"

  - name: generate_avd_structured_config
    file_path: "./generators/generate_avd_structured_config.gql"

  # AVD Transform queries
  - name: avd_device_config
    file_path: "./transforms/avd_device_config.gql"

  - name: avd_fabric_devices
    file_path: "./transforms/avd_fabric_devices.gql"


generator_definitions:
  - name: generate-fabric
    file_path: "./generators/generate_fabric.py"
    query: generate_fabric
    targets: fabrics
    parameters:
      fabric_name: name__value
    class_name: FabricGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  - name: generate-pod
    file_path: "./generators/generate_pod.py"
    query: generate_pod
    targets: pods
    parameters:
      pod_name: name__value
    class_name: PodGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  - name: generate-rack
    file_path: "./generators/generate_rack.py"
    query: generate_rack
    targets: racks
    parameters:
      rack_name: name__value
    class_name: RackGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  # AVD Input Builder - populates device.avd_inputs
  - name: generate-avd-inputs
    file_path: "./generators/generate_avd_inputs.py"
    query: generate_avd_inputs
    targets: fabrics
    parameters:
      fabric_name: name__value
    class_name: AvdInputsGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  # AVD Structured Config - populates device.avd_structured_config
  - name: generate-avd-structured-config
    file_path: "./generators/generate_avd_structured_config.py"
    query: generate_avd_structured_config
    targets: fabrics
    parameters:
      fabric_name: name__value
    class_name: AvdStructuredConfigGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

jinja2_transforms:
  - name: device_startup_config
    description: "device config transform"
    query: "network_device_startup_config"
    template_path: "./transforms/templates/startup_config.j2"

python_transforms:
  - name: computed_interface_description
    class_name: ComputedInterfaceDescription
    file_path: "./transforms/computed_interface_description.py"
  - name: cabling_plan
    class_name: CablingPlan
    file_path: "./transforms/cabling_plan.py"
  - name: avd_eos_config
    class_name: AvdEosConfigTransform
    file_path: "./transforms/avd_eos_config.py"
  - name: avd_fabric_doc
    class_name: AvdFabricDocTransform
    file_path: "./transforms/avd_fabric_doc.py"

artifact_definitions:
  - name: "startup_configuration"
    artifact_name: "Startup configuration"
    parameters:
      name: "hostname__value"
    content_type: "text/plain"
    targets: "devices"
    transformation: "device_startup_config"
  - name: "cabling_plan"
    artifact_name: "Cabling Plan"
    parameters:
      name: "name__value"
    content_type: "text/csv"
    targets: "fabrics"
    transformation: "cabling_plan"
  - name: "avd_eos_configuration"
    artifact_name: "AVD EOS Configuration"
    parameters:
      name: "hostname__value"
    content_type: "text/plain"
    targets: "devices"
    transformation: "avd_eos_config"
  - name: "avd_fabric_documentation"
    artifact_name: "AVD Fabric Documentation"
    parameters:
      name: "name__value"
    content_type: "text/markdown"
    targets: "fabrics"
    transformation: "avd_fabric_doc"
