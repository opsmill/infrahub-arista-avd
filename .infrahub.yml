---
# Schemas are intentionally NOT declared here. They are loaded explicitly via
# `inv load` / `inv load-schema` (`infrahubctl schema load schemas`) so that the
# load order and timing are controlled during setup. If you want schemas to sync
# automatically with the repository instead, uncomment the block below — but be
# aware it will then load on every repository sync.
# schemas:
#  - schemas

menus:
  - menus/menu.yml

queries:
  - name: avd_device_hostvar
    file_path: "./generators/avd_device_hostvar.gql"
  - name: generate_fabric
    file_path: "./generators/generate_fabric.gql"

  - name: generate_pod
    file_path: "./generators/generate_pod.gql"

  - name: generate_rack
    file_path: "./generators/generate_rack.gql"

  - name: computed_interface_description
    file_path: "./transforms/computed_interface_description.gql"

  - name: cabling_plan
    file_path: "./transforms/cabling_plan.gql"

  # AVD Generator query
  - name: generate_avd
    file_path: "./generators/generate_avd.gql"

  # AVD Transform queries
  - name: avd_device_config
    file_path: "./transforms/avd_device_config.gql"

  - name: avd_fabric_devices
    file_path: "./transforms/avd_fabric_devices.gql"

  - name: backfill_structured_config
    file_path: "./generators/backfill_structured_config.gql"

  - name: generate_server_cabling
    file_path: "./generators/generate_server_cabling.gql"


generator_definitions:
  - name: generate-avd-device-hostvar
    file_path: "./generators/generate_avd_device_hostvar.py"
    query: avd_device_hostvar
    targets: avd_devices
    parameters:
      name: name__value
    class_name: GenerateAVDDeviceHostvar
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false
  - name: generate-fabric
    file_path: "./generators/generate_fabric.py"
    query: generate_fabric
    targets: fabrics
    parameters:
      name: name__value
    class_name: FabricGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  - name: generate-pod
    file_path: "./generators/generate_pod.py"
    query: generate_pod
    targets: pods
    parameters:
      name: name__value
    class_name: PodGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  - name: generate-rack
    file_path: "./generators/generate_rack.py"
    query: generate_rack
    targets: racks
    parameters:
      name: name__value
    class_name: RackGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  # AVD Generator - populates device.avd_inputs and device.avd_structured_config
  - name: generate-avd-device-structured-config
    file_path: "./generators/generate_avd_device_structured_config.py"
    query: generate_avd
    targets: fabrics
    parameters:
      name: name__value
    class_name: AvdDeviceStructuredConfigGenerator
    convert_query_response: false
    execute_in_proposed_change: true
    execute_after_merge: false

  - name: backfill-structured-config
    file_path: "./generators/backfill_structured_config.py"
    query: backfill_structured_config
    targets: avd_structured_configs
    parameters:
      name: artifact__name__value
    class_name: BackfillStructuredConfigGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  - name: generate-server-cabling
    file_path: "./generators/generate_server_cabling.py"
    query: generate_server_cabling
    targets: servers
    parameters:
      name: name__value
    class_name: ServerCablingGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

python_transforms:
  - name: computed_interface_description
    class_name: ComputedInterfaceDescription
    file_path: "./transforms/computed_interface_description.py"
  - name: cabling_plan
    class_name: CablingPlan
    file_path: "./transforms/cabling_plan.py"
  - name: avd_eos_config
    class_name: AvdEosConfigTransform
    file_path: "./transforms/avd_eos_config.py"
  - name: avd_fabric_doc
    class_name: AvdFabricDocTransform
    file_path: "./transforms/avd_fabric_doc.py"
  - name: avd_device_doc
    class_name: AvdDeviceDocTransform
    file_path: "./transforms/avd_device_doc.py"

artifact_definitions:
  - name: "cabling_plan"
    artifact_name: "Cabling Plan"
    parameters:
      name: "name__value"
    content_type: "text/csv"
    targets: "fabrics"
    transformation: "cabling_plan"
  - name: "avd_eos_configuration"
    artifact_name: "AVD EOS Configuration"
    parameters:
      name: "name__value"
    content_type: "text/plain"
    targets: "avd_devices"
    transformation: "avd_eos_config"
  - name: "avd_fabric_documentation"
    artifact_name: "AVD Fabric Documentation"
    parameters:
      name: "name__value"
    content_type: "text/markdown"
    targets: "fabrics"
    transformation: "avd_fabric_doc"
  - name: "avd_device_documentation"
    artifact_name: "AVD Device Documentation"
    parameters:
      name: "name__value"
    content_type: "text/markdown"
    targets: "avd_devices"
    transformation: "avd_device_doc"
