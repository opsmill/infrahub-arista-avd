---
# ============================================================================
# L2 services for Fabric-L2LS — modeled as schema objects (IpamVLAN + EvpnTenant
# + EvpnL2Vlan), rendered by the hostvar generator. Schema-first: no escape hatch.
# Loads after the fabric (13a) so relationships resolve.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamL2Domain
  data:
    - name: Fabric-L2LS-L2Domain
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamVLAN
  data:
    - name: L2LS-DATA
      vlan_id: 10
      status: active
      role: user
      l2domain: Fabric-L2LS-L2Domain
    - name: L2LS-VOICE
      vlan_id: 20
      status: active
      role: user
      l2domain: Fabric-L2LS-L2Domain
    - name: L2LS-GUEST
      vlan_id: 30
      status: active
      role: user
      l2domain: Fabric-L2LS-L2Domain
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: EvpnTenant
  data:
    - name: L2LS-TENANT
      mac_vrf_vni_base: 20000
      fabrics:
        - "Fabric-L2LS"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: EvpnL2Vlan
  data:
    - name: "L2LS-DATA-L2"
      vlan_id: 10
      tenant: L2LS-TENANT
      vlan: L2LS-DATA
    - name: "L2LS-VOICE-L2"
      vlan_id: 20
      tenant: L2LS-TENANT
      vlan: L2LS-VOICE
    - name: "L2LS-GUEST-L2"
      vlan_id: 30
      tenant: L2LS-TENANT
      vlan: L2LS-GUEST
