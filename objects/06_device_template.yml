---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimDevice
  parameters:
    expand_range: true
  data:
    - template_name: "spine-switch"
      role: "spine"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "SpineSwitchLoopback0"
            name: "Loopback0"
            role: "loopback"
          - template_name: "SpineSwitchEthernet[1-27]"
            name: "Ethernet[1-27]"
            profiles: ["profile-interface-leaf"]
          - template_name: "SpineSwitchEthernet[28-32]"
            name: "Ethernet[28-32]"
            profiles: ["profile-interface-super-spine"]
    - template_name: "super-spine-switch"
      role: "super_spine"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "SuperSpineSwitchLoopback0"
            name: "Loopback0"
            role: "loopback"
          - template_name: "SuperSpineSwitchEthernet[1-28]"
            name: "Ethernet[1-28]"
            profiles: ["profile-interface-spine"]
          - template_name: "SuperSpineSwitchEthernet[29-32]"
            name: "Ethernet[29-32]"
    - template_name: "Generic Switch"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "GenericSwitchLoopback0"
            name: "Loopback0"
            role: "loopback"
          - template_name: "GenericSwitchEthernet[1-32]"
            name: "Ethernet[1-32]"

    - template_name: "leaf-switch-compute"
      role: "leaf"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "LeafSwitchComputeLoopback0"
            name: "Loopback0"
            role: "loopback"
          - template_name: "LeafSwitchComputeEthernet[1-24]"
            name: "Ethernet[1-24]"
            profiles: ["profile-interface-server"]
          - template_name: "LeafSwitchComputeEthernet[25-26]"
            name: "Ethernet[25-26]"
            profiles: ["profile-interface-mlag-peer"]
          - template_name: "LeafSwitchComputeEthernet[27-32]"
            name: "Ethernet[27-32]"
            profiles: ["profile-interface-spine"]

    - template_name: "leaf-switch-storage"
      role: "leaf"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "LeafSwitchStorageLoopback0"
            name: "Loopback0"
            role: "loopback"
          - template_name: "LeafSwitchStorageEthernet[1-8]"
            name: "Ethernet[1-8]"
            profiles: ["profile-interface-compute"]
          - template_name: "LeafSwitchStorageEthernet[9-10]"
            name: "Ethernet[9-10]"
            profiles: ["profile-interface-mlag-peer"]
          - template_name: "LeafSwitchStorageEthernet[11-16]"
            name: "Ethernet[11-16]"
            profiles: ["profile-interface-spine"]
    - template_name: "l2leaf-switch"
      role: "l2leaf"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "L2LeafSwitchEthernet[1-22]"
            name: "Ethernet[1-22]"
            profiles: ["profile-interface-server"]
          - template_name: "L2LeafSwitchEthernet[23-24]"
            name: "Ethernet[23-24]"
            profiles: ["profile-interface-l3leaf-uplink"]

    - template_name: "dell-z9864f-on-spine-switch"
      device_type: ["Dell", "PowerSwitch Z9864F-ON"]
      role: "spine"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "DellZ9864FSpineSwitchLoopback0"
            name: "Loopback0"
            role: "loopback"
          - template_name: "DellZ9864FSpineSwitchEthernet1/[1-32]"
            name: "Ethernet1/[1-32]"
            profiles: ["profile-interface-leaf"]
          - template_name: "DellZ9864FSpineSwitchEthernet1/[33-64]"
            name: "Ethernet1/[33-64]"
            profiles: ["profile-interface-super-spine"]
    - template_name: "dell-z9864f-on-super-spine-switch"
      device_type: ["Dell", "PowerSwitch Z9864F-ON"]
      role: "super_spine"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "DellZ9864FSuperSpineSwitchLoopback0"
            name: "Loopback0"
            role: "loopback"
          - template_name: "DellZ9864FSuperSpineSwitchEthernet1/[1-64]"
            name: "Ethernet1/[1-64]"
            profiles: ["profile-interface-spine"]
    - template_name: "dell-s5232f-on-leaf-switch-compute"
      role: "leaf"
      device_type: ["Dell", "PowerSwitch S5232F-ON"]
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "DellS5232LeafSwitchLoopback0"
            name: "Loopback0"
            role: "loopback"
          - template_name: "DellS5232FLeafSwitchEthernet1/1/[1-16]"
            name: Ethernet1/1/[1-16]
            profiles: ["profile-interface-spine"]
          - template_name: "DellS5232FLeafSwitchEthernet1/1/[17-32]"
            name: Ethernet1/1/[17-32]
            profiles: ["profile-interface-server"]
          - template_name: "DellS5232FLeafSwitchEthernet1/1/[33-34]"
            name: Ethernet1/1/[33-34]
            profiles: ["profile-interface-mlag-peer"]
    - template_name: "dell-s5232f-on-leaf-switch-storage"
      role: "leaf"
      device_type: ["Dell", "PowerSwitch S5232F-ON"]
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "DellS5232FLeafStorageSwitchLoopback0"
            name: "Loopback0"
            role: "loopback"
          - template_name: "DellS5232FLeafStorageSwitchEthernet1/1/[1-16]"
            name: Ethernet1/1/[1-16]
            profiles: ["profile-interface-spine"]
          - template_name: "DellS5232FLeafStorageSwitchEthernet1/1/[17-32]"
            name: Ethernet1/1/[17-32]
            profiles: ["profile-interface-compute"]
          - template_name: "DellS5232FLeafStorageSwitchEthernet1/1/[33-34]"
            name: Ethernet1/1/[33-34]
            profiles: ["profile-interface-mlag-peer"]

    # Arista datacenter switches (issue #70). Port layouts match the real
    # platforms and the lab's eos-intf-mapping files:
    #   7050CX3-32S  -> 32x 100G QSFP, EOS names Ethernet1/1 .. Ethernet32/1 (spine)
    #   7050SX3-48YC8 -> 48x 25G SFP (Ethernet1-48) + 8x 100G QSFP (Ethernet49/1-56/1) (leaf)
    - template_name: "arista-7050cx3-32s-spine-switch"
      role: "spine"
      device_type: ["Arista", "DCS-7050CX3-32S"]
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "Arista7050CX3SpineSwitchLoopback0"
            name: "Loopback0"
            role: "loopback"
          - template_name: "Arista7050CX3SpineSwitchEthernet[1-32]/1"
            name: "Ethernet[1-32]/1"
            profiles: ["profile-interface-leaf"]
    - template_name: "arista-7050sx3-48yc8-leaf-switch"
      role: "leaf"
      device_type: ["Arista", "DCS-7050SX3-48YC8"]
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "Arista7050SX3LeafSwitchLoopback0"
            name: "Loopback0"
            role: "loopback"
          - template_name: "Arista7050SX3LeafSwitchEthernet[1-48]"
            name: "Ethernet[1-48]"
            profiles: ["profile-interface-server"]
          - template_name: "Arista7050SX3LeafSwitchEthernet[49-54]/1"
            name: "Ethernet[49-54]/1"
            profiles: ["profile-interface-spine"]
          - template_name: "Arista7050SX3LeafSwitchEthernet[55-56]/1"
            name: "Ethernet[55-56]/1"
            profiles: ["profile-interface-mlag-peer"]
