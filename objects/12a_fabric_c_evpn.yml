---
# ============================================================================
# EVPN Services for the Fabric-C fabric
# Tenant "Arista" with VRF10 routed and stretched services.
# ============================================================================

# VRF for the Infrahub-AVD dual-DC lab.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: EvpnDomain
  data:
    - name: Fabric-C-DC1
      domain_id: "65100:1"
      fabric: Fabric-C
    - name: Fabric-C-DC2
      domain_id: "65200:1"
      fabric: Fabric-C
    - name: CORE
      domain_id: "65000:100"
      fabric: Fabric-C
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkPod
  data:
    - name: infrahub-dc1
      index: 1
      parent: Fabric-C
      evpn_domain: ["Fabric-C", "65100:1"]
    - name: infrahub-dc2
      index: 2
      parent: Fabric-C
      evpn_domain: ["Fabric-C", "65200:1"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamVRF
  data:
    - name: VRF10
      namespace: default
      vrf_vni: 10
---
# EVPN Tenant linked to the generated lab fabric.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: EvpnTenant
  data:
    - name: Arista
      mac_vrf_vni_base: 10000
      fabrics:
        - "Fabric-C"
      vrfs:
        - VRF10
---
# SVIs for VRF10. Tags let AVD scope local vs stretched services.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: EvpnSvi
  data:
    - name: VLAN11_DC1
      svi_id: 11
      ip_address_virtual: "10.10.11.1/24"
      enabled: true
      vrf: VRF10
      avd_tags:
        - DC1
    - name: VLAN12_DC2
      svi_id: 12
      ip_address_virtual: "10.10.12.1/24"
      enabled: true
      vrf: VRF10
      avd_tags:
        - DC2
    - name: VLAN19_STRETCHED
      svi_id: 19
      ip_address_virtual: "10.10.19.1/24"
      enabled: true
      vrf: VRF10
      avd_tags:
        - DC1
        - DC2
