---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ProfileDcimInterface
  data:
    - profile_name: "profile-server-compute"
      role: "server"
      mtu: 9000
      tagged_vlan:
        - ["Servers"]
        - ["Storage"]
    - profile_name: "profile-server-gpu"
      role: "server"
      mtu: 9000
      tagged_vlan:
        - ["Servers"]
        - ["Storage"]
        - ["Backup"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateComputePhysicalServer
  parameters:
    expand_range: true
  data:
    - template_name: "compute-server-single"
      role: "compute"
      status: "provisioning"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "ComputeServerSingleEthernet1"
            name: "Ethernet1"
            profiles: ["profile-server-compute"]
    - template_name: "compute-server-dual"
      role: "compute"
      status: "provisioning"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "ComputeServerDualEthernet[1-2]"
            name: "Ethernet[1-2]"
            profiles: ["profile-server-compute"]
    - template_name: "gpu-server-single"
      role: "gpu"
      status: "provisioning"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "GpuServerSingleEthernet1"
            name: "Ethernet1"
            profiles: ["profile-server-gpu"]
---
# ============================================================================
# L3LS example fabrics — connected endpoints (physical servers) for the
# existing Fabric-L3LS-MultiPod-A and Fabric-L3LS-MultiPod-B leaf racks. Loaded after the fabric/pod/rack
# objects (11_rack.yml) so the racks exist first. Each server declares only its
# rack + object_template + servers-group membership; the generate-server-cabling
# generator (targets the "servers" group) auto-cables the server to its rack's
# leaf switches. member_of_groups is set atomically in the same object so the
# generator trigger does not race group membership.
#   Fabric-L3LS-MultiPod-A:
#     - fabric-l3ls-multipod-a-server1/2: dual-homed (compute-server-dual) on Rack-A2-1
#       (compute rack, MLAG leaf pair)
#     - fabric-l3ls-multipod-a-gpu1: single-homed GPU (gpu-server-single) on Rack-A3-1
#   Fabric-L3LS-MultiPod-B:
#     - fabric-l3ls-multipod-b-server1/2: single-homed (compute-server-single) on Rack-B2-1
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ComputePhysicalServer
  data:
    - name: "fabric-l3ls-multipod-a-server1"
      status: "provisioning"
      rack: "Rack-A2-1"
      object_template: "compute-server-dual"
      member_of_groups: ["servers"]
    - name: "fabric-l3ls-multipod-a-server2"
      status: "provisioning"
      rack: "Rack-A2-1"
      object_template: "compute-server-dual"
      member_of_groups: ["servers"]
    - name: "fabric-l3ls-multipod-a-gpu1"
      status: "provisioning"
      rack: "Rack-A3-1"
      object_template: "gpu-server-single"
      member_of_groups: ["servers"]
    - name: "fabric-l3ls-multipod-b-server1"
      status: "provisioning"
      rack: "Rack-B2-1"
      object_template: "compute-server-single"
      member_of_groups: ["servers"]
    - name: "fabric-l3ls-multipod-b-server2"
      status: "provisioning"
      rack: "Rack-B2-1"
      object_template: "compute-server-single"
      member_of_groups: ["servers"]
