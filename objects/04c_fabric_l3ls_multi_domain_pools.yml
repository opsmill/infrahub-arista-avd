---
# ============================================================================
# IP and number pools for the Fabric-L3LS-Multi-Domain lab fabric.
# Derived from lab/infrahub-avd seed data after renaming to Fabric-L3LS-Multi-Domain.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.0.6.0/24
      role: management
    - prefix: 10.250.1.0/24
      role: loopback
    - prefix: 10.250.2.0/24
      role: loopback-vtep
    - prefix: 10.250.3.0/24
      role: pod_leaf_spine
    - prefix: 172.16.0.0/28
      role: technical
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: Fabric-L3LS-Multi-Domain-Uplink-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - 10.250.3.0/24
    - name: Fabric-L3LS-Multi-Domain-VTEP-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 32
      ip_namespace: default
      resources:
        - 10.250.2.0/24
    - name: Fabric-L3LS-Multi-Domain-Loopback-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 32
      ip_namespace: default
      resources:
        - 10.250.1.0/24
    - name: Fabric-L3LS-Multi-Domain-DCI-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - 172.16.0.0/28
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: Fabric-L3LS-Multi-Domain-Mgmt-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 24
      ip_namespace: default
      resources:
        - 10.0.6.0/24
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: Fabric-L3LS-Multi-Domain-ASN-Pool
      node: RoutingAsn
      node_attribute: asn
      start_range: 65100
      end_range: 65199
    - name: Fabric-L3LS-Multi-Domain-NodeID-Pool
      node: DcimDevice
      node_attribute: node_id
      start_range: 1
      end_range: 100
