---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.0.0.0/8
      role: supernet
---
# ASN Pool for Fabric-A (private ASN range)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: Fabric-A-ASN-Pool
      node: RoutingAsn
      node_attribute: asn
      start_range: 65000
      end_range: 65050
---
# Node ID Pool for Fabric-A
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: Fabric-A-NodeID-Pool
      node: DcimDevice
      node_attribute: node_id
      start_range: 1
      end_range: 50
---
# ASN Pool for Fabric-B (separate range)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: Fabric-B-ASN-Pool
      node: RoutingAsn
      node_attribute: asn
      start_range: 65051
      end_range: 65099
---
# Node ID Pool for Fabric-B
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: Fabric-B-NodeID-Pool
      node: DcimDevice
      node_attribute: node_id
      start_range: 1
      end_range: 50
---
# Management IP Prefix for Fabric-A
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.255.0.0/24
      role: management
---
# Management IP Pool for Fabric-A
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: Fabric-A-Mgmt-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 24
      ip_namespace: default
      resources:
        - "10.255.0.0/24"
---
# Management IP Prefix for Fabric-B (Fabric-B lives entirely in 10.254.0.0/16)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.254.0.0/24
      role: management
---
# Management IP Pool for Fabric-B
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: Fabric-B-Mgmt-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 24
      ip_namespace: default
      resources:
        - "10.254.0.0/24"
---
# P2P Uplink Prefix for Fabric-A
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.255.252.0/22
      role: pod_leaf_spine
---
# P2P Uplink Pool for Fabric-A
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: Fabric-A-Uplink-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - "10.255.252.0/22"
---
# VTEP Loopback Prefix for Fabric-A
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.255.3.0/24
      role: loopback-vtep
---
# VTEP Loopback Pool for Fabric-A
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: Fabric-A-VTEP-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 32
      ip_namespace: default
      resources:
        - "10.255.3.0/24"
---
# MLAG Peer-Link / L3 Peering Prefixes for Fabric-A pods.
# Each pod gets a disjoint /25 so the per-pod pools never allocate overlapping
# addresses: peer-links carve out of 10.255.4.0/24, L3 peerings out of 10.255.5.0/24.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.255.4.0/25     # Pod-A2 MLAG peer-link
      role: technical
    - prefix: 10.255.4.128/25   # Pod-A3 MLAG peer-link
      role: technical
    - prefix: 10.255.5.0/25     # Pod-A2 MLAG L3 peering
      role: technical
    - prefix: 10.255.5.128/25   # Pod-A3 MLAG L3 peering
      role: technical
---
# MLAG Peer Pool for Fabric-A Pod-A2
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: Fabric-A-Pod-A2-MLAG-Peer-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - "10.255.4.0/25"
---
# MLAG L3 Peering Pool for Fabric-A Pod-A2
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: Fabric-A-Pod-A2-MLAG-L3-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - "10.255.5.0/25"
---
# MLAG Peer Pool for Fabric-A Pod-A3
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: Fabric-A-Pod-A3-MLAG-Peer-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - "10.255.4.128/25"
---
# MLAG L3 Peering Pool for Fabric-A Pod-A3
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: Fabric-A-Pod-A3-MLAG-L3-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - "10.255.5.128/25"
---
# Device Loopback Prefix for Fabric-A (distinct from mgmt 10.255.0.0/24)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.255.2.0/24
      role: loopback
---
# Device Loopback Pool for Fabric-A
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: Fabric-A-Loopback-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 32
      ip_namespace: default
      resources:
        - "10.255.2.0/24"
---
# P2P Uplink Prefix for Fabric-B
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
