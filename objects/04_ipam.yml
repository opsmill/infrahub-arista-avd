---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.0.0.0/8
      role: supernet
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: FabricSupernetPool
      default_member_type: prefix
      default_prefix_type: "IpamPrefix"
      default_prefix_length: 16
      ip_namespace: "default"
      resources:
        - "10.0.0.0/8"
---
# ASN Pool for Fabric-A (private ASN range)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: Fabric-A-ASN-Pool
      node: RoutingAsn
      node_attribute: asn
      start_range: 65000
      end_range: 65999
---
# Node ID Pool for Fabric-A
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: Fabric-A-NodeID-Pool
      node: DcimDevice
      node_attribute: node_id
      start_range: 1
      end_range: 9999
---
# ASN Pool for Fabric-B (separate range)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: Fabric-B-ASN-Pool
      node: RoutingAsn
      node_attribute: asn
      start_range: 65100
      end_range: 65199
---
# Node ID Pool for Fabric-B
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: Fabric-B-NodeID-Pool
      node: DcimDevice
      node_attribute: node_id
      start_range: 1
      end_range: 9999
---
# Management IP Prefix for Fabric-A
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.255.0.0/24
      role: management
---
# Management IP Pool for Fabric-A
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: Fabric-A-Mgmt-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 24
      ip_namespace: default
      resources:
        - "10.255.0.0/24"
---
# Management IP Prefix for Fabric-B (Fabric-B lives entirely in 10.254.0.0/16)
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.254.0.0/24
      role: management
---
# Management IP Pool for Fabric-B
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: Fabric-B-Mgmt-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 24
      ip_namespace: default
      resources:
        - "10.254.0.0/24"
