---
# ============================================================================
# Customer L3VPN services for Fabric-ISIS-LDP — schema objects (IpamVRF +
# EvpnTenant + EvpnSvi) rendered on the PE routers as MPLS/VPN-IPv4 VRFs.
# Loads after the fabric (13c).
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamL2Domain
  data:
    - name: Fabric-ISIS-LDP-L2Domain
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamVLAN
  data:
    - name: C1-DATA
      vlan_id: 101
      status: active
      role: user
      l2domain: Fabric-ISIS-LDP-L2Domain
    - name: C2-DATA
      vlan_id: 201
      status: active
      role: user
      l2domain: Fabric-ISIS-LDP-L2Domain
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamVRF
  data:
    - name: C1_VRF1
      namespace: default
      vrf_vni: 401
    - name: C2_VRF1
      namespace: default
      vrf_vni: 402
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: EvpnTenant
  data:
    - name: CUSTOMER1
      mac_vrf_vni_base: 40000
      fabrics:
        - "Fabric-ISIS-LDP"
      vrfs:
        - C1_VRF1
    - name: CUSTOMER2
      mac_vrf_vni_base: 41000
      fabrics:
        - "Fabric-ISIS-LDP"
      vrfs:
        - C2_VRF1
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: EvpnSvi
  data:
    - name: "C1-DATA-SVI"
      svi_id: 101
      ip_address_virtual: "10.101.1.1/24"
      enabled: true
      vrf: C1_VRF1
      vlan: C1-DATA
    - name: "C2-DATA-SVI"
      svi_id: 201
      ip_address_virtual: "10.201.1.1/24"
      enabled: true
      vrf: C2_VRF1
      vlan: C2-DATA
