---
# ============================================================================
# EVPN Services for the Fabric-L3LS-Multi-Domain fabric
# Tenant "Arista" with VRF20 routed and stretched services.
# ============================================================================

# VRF for the Infrahub-AVD dual-DC lab.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: EvpnDomain
  data:
    - name: Fabric-L3LS-Multi-Domain-DC1
      domain_id: "65100:1"
      fabric: Fabric-L3LS-Multi-Domain
    - name: Fabric-L3LS-Multi-Domain-DC2
      domain_id: "65200:1"
      fabric: Fabric-L3LS-Multi-Domain
    - name: CORE
      domain_id: "65000:100"
      fabric: Fabric-L3LS-Multi-Domain
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkPod
  data:
    - name: infrahub-dc1
      index: 1
      parent: Fabric-L3LS-Multi-Domain
      evpn_domain: ["Fabric-L3LS-Multi-Domain", "65100:1"]
    - name: infrahub-dc2
      index: 2
      parent: Fabric-L3LS-Multi-Domain
      evpn_domain: ["Fabric-L3LS-Multi-Domain", "65200:1"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamVRF
  data:
    - name: VRF20
      namespace: default
      vrf_vni: 10
---
# EVPN Tenant linked to the generated lab fabric.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: EvpnTenant
  data:
    - name: Arista
      mac_vrf_vni_base: 10000
      fabrics:
        - "Fabric-L3LS-Multi-Domain"
      vrfs:
        - VRF20
---
# SVIs for VRF20. Tags let AVD scope local vs stretched services.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: EvpnSvi
  data:
    - name: VLAN21_DC1
      svi_id: 21
      ip_address_virtual: "10.20.21.1/24"
      enabled: true
      vrf: VRF20
      avd_tags:
        - DC1
    - name: VLAN22_DC2
      svi_id: 22
      ip_address_virtual: "10.20.22.1/24"
      enabled: true
      vrf: VRF20
      avd_tags:
        - DC2
    - name: VLAN29_STRETCHED
      svi_id: 29
      ip_address_virtual: "10.20.29.1/24"
      enabled: true
      vrf: VRF20
      avd_tags:
        - DC1
        - DC2
