---
# ============================================================================
# Fabric-L2LS — standalone Layer-2 Leaf-Spine example (AVD "l2ls-fabric").
# underlay_routing_protocol: none -> the pod/rack generators create l2spine
# spines and l2leaf leaves (gated on the fabric underlay). No EVPN/underlay
# routing; pure Layer-2 fabric.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.60.0.0/24
      role: management
    - prefix: 10.60.1.0/24
      role: loopback
    - prefix: 10.60.2.0/24
      role: loopback-vtep
    - prefix: 10.60.3.0/24
      role: pod_leaf_spine
    - prefix: 10.60.4.0/24     # MLAG peer-link addressing (l2leaf pair)
      role: technical
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: Fabric-L2LS-Uplink-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - 10.60.3.0/24
    - name: Fabric-L2LS-VTEP-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 32
      ip_namespace: default
      resources:
        - 10.60.2.0/24
    - name: Fabric-L2LS-Loopback-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 32
      ip_namespace: default
      resources:
        - 10.60.1.0/24
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: Fabric-L2LS-Mgmt-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 24
      ip_namespace: default
      resources:
        - 10.60.0.0/24
    # MLAG peer-link pool for the l2leaf main-tier pair. /31 members, disjoint
    # from the management/loopback/vtep/uplink subnets above.
    - name: Fabric-L2LS-MLAG-Peer-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - 10.60.4.0/24
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: Fabric-L2LS-ASN-Pool
      node: RoutingAsn
      node_attribute: asn
      start_range: 65600
      end_range: 65699
    - name: Fabric-L2LS-NodeID-Pool
      node: DcimDevice
      node_attribute: node_id
      start_range: 1
      end_range: 100
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkFabric
  data:
    - name: "Fabric-L2LS"
      index: 60
      # Standalone L2LS: no super-spines (no super_spine device design).
      fabric_interface_sorting_method: "create_reverse_sorted_device_interface_map"
      mgmt_gateway: "10.60.0.1"
      asn_pool: "Fabric-L2LS-ASN-Pool"
      node_id_pool: "Fabric-L2LS-NodeID-Pool"
      mgmt_pool: "Fabric-L2LS-Mgmt-Pool"
      virtual_router_mac: "00:1c:73:00:00:66"
      underlay_routing_protocol: "none"
      p2p_uplinks_mtu: 9214
      uplink_pool: "Fabric-L2LS-Uplink-Pool"
      vtep_pool: "Fabric-L2LS-VTEP-Pool"
      loopback_pool: "Fabric-L2LS-Loopback-Pool"
      spanning_tree_mode: "mstp"
      dns_servers:
        - dns-google
      ntp_servers:
        - time.google.com
      local_users:
        - admin
      member_of_groups: ["fabrics"]
      children:
        kind: NetworkPod
        data:
          - name: "l2ls-pod1"
            index: 1
            device_designs:
              data:
                - role: spine
                  device_quantity: 2
                  device_template: arista-7050cx3-32c-spine-switch
            mlag_peer_pool: "Fabric-L2LS-MLAG-Peer-Pool"
            member_of_groups: ["pods"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationHall
  data:
    - name: "Hall-L2LS"
      index: 60
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationRack
  data:
    # Two MLAG rack pairs mirror the AVD l2ls-fabric example (RACK1: LEAF1/2,
    # RACK2: LEAF3/4). Each rack is an MLAG leaf pair.
    - name: "L2LS_RACK1"
      index: 1
      rack_type: compute
      pod: l2ls-pod1
      parent: "Hall-L2LS"
      mlag: true
      device_designs:
        data:
          - role: leaf
            device_quantity: 2
            device_template: arista-7050sx3-48yc8c-leaf-switch
      member_of_groups: ["racks"]
    - name: "L2LS_RACK2"
      index: 2
      rack_type: compute
      pod: l2ls-pod1
      parent: "Hall-L2LS"
      mlag: true
      device_designs:
        data:
          - role: leaf
            device_quantity: 2
            device_template: arista-7050sx3-48yc8c-leaf-switch
      member_of_groups: ["racks"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  # Per-tier MSTP priorities matching the AVD l2ls-fabric example
  # (l2spine=4096, l2leaf=16384).
  kind: NetworkSpanningTreePriority
  data:
    - fabric: "Fabric-L2LS"
      role: l2spine
      priority: 4096
    - fabric: "Fabric-L2LS"
      role: l2leaf
      priority: 16384
---
# ============================================================================
# L2 services for Fabric-L2LS - mirrors the AVD "l2ls-fabric" example exactly:
# tenant MY_FABRIC with three pure-Layer-2 VLANs (BLUE-NET/GREEN-NET/ORANGE-NET)
# scoped to leaf pairs by AVD tag (RACK1 = blue+green, RACK2 = blue+orange).
# Overlay-free: the tenant has NO mac_vrf_vni_base, so no VNI/VXLAN/EVPN is
# derived (l2spine/l2leaf are not VTEPs). Schema-first: no escape hatch.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamL2Domain
  data:
    - name: Fabric-L2LS-L2Domain
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamVLAN
  data:
    - name: BLUE-NET
      vlan_id: 10
      status: active
      role: user
      l2domain: Fabric-L2LS-L2Domain
    - name: GREEN-NET
      vlan_id: 20
      status: active
      role: user
      l2domain: Fabric-L2LS-L2Domain
    - name: ORANGE-NET
      vlan_id: 30
      status: active
      role: user
      l2domain: Fabric-L2LS-L2Domain
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  # AVD tag zones scope VLANs to leaf pairs (the example's bluezone/greenzone/
  # orangezone). A tag is linked to the racks whose leaves carry the VLAN.
  kind: AvdTag
  data:
    - name: bluezone
      description: "Blue zone — VLAN 10 across all racks"
      racks:
        - L2LS_RACK1
        - L2LS_RACK2
    - name: greenzone
      description: "Green zone — VLAN 20 on RACK1"
      racks:
        - L2LS_RACK1
    - name: orangezone
      description: "Orange zone — VLAN 30 on RACK2"
      racks:
        - L2LS_RACK2
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: EvpnTenant
  data:
    # Overlay-free tenant: no mac_vrf_vni_base -> pure Layer-2, no VNI/VXLAN.
    - name: MY_FABRIC
      fabrics:
        - "Fabric-L2LS"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: EvpnL2Vlan
  data:
    - name: "BLUE-NET-L2"
      vlan_id: 10
      tenant: MY_FABRIC
      vlan: BLUE-NET
      avd_tags:
        - bluezone
    - name: "GREEN-NET-L2"
      vlan_id: 20
      tenant: MY_FABRIC
      vlan: GREEN-NET
      avd_tags:
        - greenzone
    - name: "ORANGE-NET-L2"
      vlan_id: 30
      tenant: MY_FABRIC
      vlan: ORANGE-NET
      avd_tags:
        - orangezone
---
# ============================================================================
# Fabric-L2LS — connected endpoints (physical servers) for L2LS_RACK1.
# Loaded after 13a so the fabric/pod/rack exist first. Each server declares
# only its rack + object_template + servers-group membership; the
# generate-server-cabling generator (targets the "servers" group) auto-cables
# the server to the rack's leaf switches. member_of_groups is set atomically
# in the same object so the generator trigger does not race group membership.
#   - l2ls-server1: dual-homed (compute-server-dual) across the MLAG leaf pair
#   - l2ls-server2: single-homed (compute-server-single)
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ComputePhysicalServer
  data:
    - name: "l2ls-server1"
      status: "provisioning"
      rack: "L2LS_RACK1"
      object_template: "compute-server-dual"
      member_of_groups: ["servers"]
    - name: "l2ls-server2"
      status: "provisioning"
      rack: "L2LS_RACK1"
      object_template: "compute-server-single"
      member_of_groups: ["servers"]
