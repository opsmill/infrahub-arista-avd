---
# ============================================================================
# IP and number pools for the INFRAHUB_AVD lab fabric.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.0.0.0/8
      role: supernet
    - prefix: 10.0.6.0/24
      role: management
    - prefix: 10.250.1.0/24
      role: pod_loopback
    - prefix: 10.250.2.0/24
      role: loopback-vtep
    - prefix: 10.250.3.0/24
      role: pod_leaf_spine
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: FabricSupernetPool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 16
      ip_namespace: default
      resources:
        - 10.0.0.0/8
    - name: INFRAHUB_AVD-Uplink-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - 10.250.3.0/24
    - name: INFRAHUB_AVD-VTEP-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 32
      ip_namespace: default
      resources:
        - 10.250.2.0/24
    - name: INFRAHUB_AVD-Loopback-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 32
      ip_namespace: default
      resources:
        - 10.250.1.0/24
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: Infrahub-Mgmt-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 24
      ip_namespace: default
      resources:
        - 10.0.6.0/24
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: INFRAHUB_AVD-ASN-Pool
      node: DcimDevice
      node_attribute: bgp_asn
      start_range: 65100
      end_range: 65299
    - name: INFRAHUB_AVD-NodeID-Pool
      node: DcimDevice
      node_attribute: node_id
      start_range: 1
      end_range: 999
