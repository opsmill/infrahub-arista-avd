---
# ============================================================================
# IP and number pools for the Fabric-L3LS-Multi-Domain lab fabric.
# Derived from lab/infrahub-avd seed data after renaming to Fabric-L3LS-Multi-Domain.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 10.0.6.0/24
      role: management
    - prefix: 10.250.1.0/24
      role: loopback
    - prefix: 10.250.2.0/24
      role: loopback-vtep
    - prefix: 10.250.3.0/24
      role: pod_leaf_spine
    - prefix: 172.16.0.0/28
      role: technical
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: Fabric-L3LS-Multi-Domain-Uplink-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - 10.250.3.0/24
    - name: Fabric-L3LS-Multi-Domain-VTEP-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 32
      ip_namespace: default
      resources:
        - 10.250.2.0/24
    - name: Fabric-L3LS-Multi-Domain-Loopback-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 32
      ip_namespace: default
      resources:
        - 10.250.1.0/24
    - name: Fabric-L3LS-Multi-Domain-DCI-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - 172.16.0.0/28
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: Fabric-L3LS-Multi-Domain-Mgmt-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 24
      ip_namespace: default
      resources:
        - 10.0.6.0/24
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: Fabric-L3LS-Multi-Domain-ASN-Pool
      node: RoutingAsn
      node_attribute: asn
      start_range: 65100
      end_range: 65199
    - name: Fabric-L3LS-Multi-Domain-NodeID-Pool
      node: DcimDevice
      node_attribute: node_id
      start_range: 1
      end_range: 100
---
# DNS Servers
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkDnsServer
  data:
    - name: dns-google
      ip_address: 8.8.8.8/32
---
# NTP Servers
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkNtpServer
  data:
    - name: time.google.com
---
# Local Users
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkLocalUser
  data:
    - name: mtache
      privilege: 15
      role: network-admin
      password_type: type7
      password: "nopassword"
---
# ============================================================================
# Fabric-L3LS-Multi-Domain: one generated fabric with two datacenter pods.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkFabric
  data:
    - name: "Fabric-L3LS-Multi-Domain"
      index: 3
      fabric_interface_sorting_method: "create_sorted_device_interface_map"
      virtual_router_mac: "00:1c:73:00:00:01"
      mgmt_gateway: "10.0.6.1"
      asn_pool: "Fabric-L3LS-Multi-Domain-ASN-Pool"
      node_id_pool: "Fabric-L3LS-Multi-Domain-NodeID-Pool"
      mgmt_pool: "Fabric-L3LS-Multi-Domain-Mgmt-Pool"
      underlay_routing_protocol: "ebgp"
      overlay_routing_protocol: "ebgp"
      p2p_uplinks_mtu: 1500
      uplink_pool: "Fabric-L3LS-Multi-Domain-Uplink-Pool"
      vtep_pool: "Fabric-L3LS-Multi-Domain-VTEP-Pool"
      loopback_pool: "Fabric-L3LS-Multi-Domain-Loopback-Pool"
      dci_pool: "Fabric-L3LS-Multi-Domain-DCI-Pool"
      spanning_tree_mode: "mstp"
      spanning_tree_priority: 4096
      avd_custom_hostvars:
        custom_structured_configuration_aliases: |
          alias cc clear counters
          alias sa show active
          alias senz show interface counter error | nz
          alias shmc show int | awk '/^[A-Z]/ { intf = $1 } /, address is/ { print intf, $6 }'
          alias snz show interface counter | nz
          alias sqnz show interface counter queue | nz
          alias srnz show interface counter rate | nz
        custom_structured_configuration_clock:
          timezone: Europe/Paris
        custom_structured_configuration_aaa_authentication:
          policies:
            local:
              allow_nopassword: true
        custom_structured_configuration_management_interfaces:
          - name: Management1
            lldp:
              transmit: false
              receive: false
        cv_settings:
          cvaas:
            enabled: true
            clusters:
              - name: cvaas
                token_file: /mnt/flash/cv-onboarding-token
          terminattr:
            smashexcludes: ale,flexCounter,kni,pulse,strata
            disable_aaa: true
        custom_structured_configuration_daemon_terminattr:
          cvtargetconfigs:
            - arista/traffic-policy
        management_eapi:
          enabled: true
        bgp_graceful_restart:
          enabled: true
        evpn_ebgp_gateway_multihop: 3
        custom_platform_settings:
          - platforms: [default]
            feature_support:
              bgp_update_wait_for_convergence: false
              bgp_update_wait_install: false
              evpn_gateway_all_active_multihoming: true
              interface_storm_control: false
              queue_monitor_length_notify: false
              sflow_subinterfaces: false
            management_interface: Management1
            raw_eos_cli: |
              platform tfa
                interface mode relaying
        custom_structured_configuration_router_bgp:
          address_family_evpn:
            route:
              import_ethernet_segment_ip_mass_withdraw: true
              export_ethernet_segment_ip_mass_withdraw: true
            layer_2_fec_in_place_update:
              enabled: true
      dns_servers:
        - dns-google
      ntp_servers:
        - time.google.com
      local_users:
        - admin
        - mtache
      member_of_groups: ["fabrics"]
      children:
        kind: NetworkPod
        data:
          - name: "infrahub-dc1"
            index: 1
            device_designs:
              data:
                - role: spine
                  device_quantity: 2
                  device_template: arista-7050cx3-32c-spine-switch
            member_of_groups: ["pods"]
          - name: "infrahub-dc2"
            index: 2
            device_designs:
              data:
                - role: spine
                  device_quantity: 2
                  device_template: arista-7050cx3-32c-spine-switch
            member_of_groups: ["pods"]
---
# ============================================================================
# Halls and racks for the Fabric-L3LS-Multi-Domain dual-DC lab.
# Rack names match the AVD group names; generated device names remain
# generator-derived from pod name, rack index, and leaf index.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationHall
  data:
    - name: "Hall-DC1"
      index: 1
    - name: "Hall-DC2"
      index: 2

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationRack
  data:
    - name: "DC1_BORDER"
      index: 1
      rack_type: compute
      pod: infrahub-dc1
      parent: "Hall-DC1"
      mlag: false
      device_designs:
        data:
          - role: leaf
            device_quantity: 2
            device_template: arista-7050sx3-48yc8c-leaf-switch
      member_of_groups: ["racks"]
    - name: "DC1_ACCESS"
      index: 2
      rack_type: compute
      pod: infrahub-dc1
      parent: "Hall-DC1"
      mlag: false
      device_designs:
        data:
          - role: leaf
            device_quantity: 2
            device_template: arista-7050sx3-48yc8c-leaf-switch
      member_of_groups: ["racks"]
    - name: "DC2_BORDER"
      index: 1
      rack_type: compute
      pod: infrahub-dc2
      parent: "Hall-DC2"
      mlag: false
      device_designs:
        data:
          - role: leaf
            device_quantity: 2
            device_template: arista-7050sx3-48yc8c-leaf-switch
      member_of_groups: ["racks"]
    - name: "DC2_ACCESS"
      index: 2
      rack_type: compute
      pod: infrahub-dc2
      parent: "Hall-DC2"
      mlag: false
      device_designs:
        data:
          - role: leaf
            device_quantity: 2
            device_template: arista-7050sx3-48yc8c-leaf-switch
      member_of_groups: ["racks"]

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AvdTag
  data:
    - name: DC1
      description: "Fabric-L3LS-Multi-Domain DC1-local AVD services"
      racks:
        - DC1_ACCESS
        - DC1_BORDER
    - name: DC2
      description: "Fabric-L3LS-Multi-Domain DC2-local AVD services"
      racks:
        - DC2_ACCESS
        - DC2_BORDER
