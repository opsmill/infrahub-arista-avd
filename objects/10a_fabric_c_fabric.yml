---
# ============================================================================
# Fabric-C: one generated fabric with two datacenter pods.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkFabric
  data:
    - name: "Fabric-C"
      index: 3
      amount_of_super_spines: 0
      fabric_interface_sorting_method: "create_sorted_device_interface_map"
      virtual_router_mac: "00:1c:73:00:00:01"
      mgmt_gateway: "10.0.6.1"
      asn_pool: "Fabric-C-ASN-Pool"
      node_id_pool: "Fabric-C-NodeID-Pool"
      mgmt_pool: "Fabric-C-Mgmt-Pool"
      underlay_routing_protocol: "ebgp"
      overlay_routing_protocol: "ebgp"
      p2p_uplinks_mtu: 1500
      uplink_pool: "Fabric-C-Uplink-Pool"
      vtep_pool: "Fabric-C-VTEP-Pool"
      loopback_pool: "Fabric-C-Loopback-Pool"
      spanning_tree_mode: "mstp"
      spanning_tree_priority: 4096
      # avd_custom_hostvars requires PR #67. Keep this lab hostvars payload
      # commented out so Fabric-C seed data can load against main schemas.
      avd_custom_hostvars:
        custom_structured_configuration_aliases: |
          alias cc clear counters
          alias sa show active
          alias senz show interface counter error | nz
          alias shmc show int | awk '/^[A-Z]/ { intf = $1 } /, address is/ { print intf, $6 }'
          alias snz show interface counter | nz
          alias sqnz show interface counter queue | nz
          alias srnz show interface counter rate | nz
        custom_structured_configuration_clock:
          timezone: Europe/Paris
        custom_structured_configuration_aaa_authentication:
          policies:
            local:
              allow_nopassword: true
        custom_structured_configuration_management_interfaces:
          - name: Management1
            lldp:
              transmit: false
              receive: false
        cv_settings:
          cvaas:
            enabled: true
            clusters:
              - name: cvaas
                token_file: /mnt/flash/cv-onboarding-token
          terminattr:
            smashexcludes: ale,flexCounter,kni,pulse,strata
            disable_aaa: true
        custom_structured_configuration_daemon_terminattr:
          cvtargetconfigs:
            - arista/traffic-policy
        management_eapi:
          enabled: true
        bgp_graceful_restart:
          enabled: true
        default_interfaces:
          - types: [spine]
            platforms: [default]
            downlink_interfaces: [Ethernet1/1, Ethernet2/1, Ethernet3/1, Ethernet4/1]
          - types: [l3leaf]
            platforms: [default]
            uplink_interfaces: [Ethernet49/1, Ethernet50/1]
        custom_platform_settings:
          - platforms: [default]
            feature_support:
              bgp_update_wait_for_convergence: false
              bgp_update_wait_install: false
              evpn_gateway_all_active_multihoming: true
              interface_storm_control: false
              queue_monitor_length_notify: false
              sflow_subinterfaces: false
            management_interface: Management1
            raw_eos_cli: |
              platform tfa
                interface mode relaying
        custom_structured_configuration_router_bgp:
          address_family_evpn:
            route:
              import_ethernet_segment_ip_mass_withdraw: true
              export_ethernet_segment_ip_mass_withdraw: true
            layer_2_fec_in_place_update:
              enabled: true
        l3leaf:
          defaults:
            evpn_gateway:
              evpn_l2:
                enabled: true
              evpn_l3:
                enabled: true
                inter_domain: true
              remote_peers:
                - hostname: leaf-infrahub-dc2-1-1
                  bgp_as: 65201
                  ip_address: 10.251.1.3
                - hostname: leaf-infrahub-dc2-1-2
                  bgp_as: 65202
                  ip_address: 10.251.1.4
              all_active_multihoming:
                enabled: true
                enable_d_path: true
                evpn_domain_id_local: "65100:1"
                evpn_domain_id_remote: "65200:100"
                evpn_ethernet_segment:
                  identifier: "0000:0000:0000:0000:0001"
                  rt_import: "00:00:00:00:00:01"
        l3_edge:
          p2p_links_ip_pools:
            - name: POOL_DCI
              ipv4_pool: 172.16.0.0/28
          p2p_links_profiles:
            - name: DCI
              ip_pool: POOL_DCI
          p2p_links:
            - id: 1
              nodes: [leaf-infrahub-dc1-1-1, leaf-infrahub-dc2-1-1]
              interfaces: [Ethernet5, Ethernet5]
              as: [65101, 65201]
              profile: DCI
            - id: 2
              nodes: [leaf-infrahub-dc1-1-1, leaf-infrahub-dc2-1-2]
              interfaces: [Ethernet6, Ethernet6]
              as: [65101, 65202]
              profile: DCI
            - id: 3
              nodes: [leaf-infrahub-dc1-1-2, leaf-infrahub-dc2-1-2]
              interfaces: [Ethernet5, Ethernet5]
              as: [65102, 65202]
              profile: DCI
            - id: 4
              nodes: [leaf-infrahub-dc1-1-2, leaf-infrahub-dc2-1-1]
              interfaces: [Ethernet6, Ethernet6]
              as: [65102, 65201]
              profile: DCI
        servers:
          - name: dc1-server1
            adapters:
              - switches: [leaf-infrahub-dc1-2-1, leaf-infrahub-dc1-2-2]
                switch_ports: [Ethernet1, Ethernet1]
                endpoint_ports: [eth1, eth2]
                mode: trunk
                vlans: "11,19"
                native_vlan: 4092
                spanning_tree_portfast: edge
                ethernet_segment:
                  short_esi: auto
                port_channel:
                  mode: active
                  description: dc1-server1
          - name: dc2-server1
            adapters:
              - switches: [leaf-infrahub-dc2-2-1, leaf-infrahub-dc2-2-2]
                switch_ports: [Ethernet1, Ethernet1]
                endpoint_ports: [eth1, eth2]
                mode: trunk
                vlans: "12,19"
                native_vlan: 4092
                spanning_tree_portfast: edge
                ethernet_segment:
                  short_esi: auto
                port_channel:
                  mode: active
                  description: dc2-server1
      dns_servers:
        - dns-google
      ntp_servers:
        - time.google.com
      local_users:
        - admin-nopass
        - mtache-nopass
      member_of_groups: ["fabrics"]
      children:
        kind: NetworkPod
        data:
          - name: "infrahub-dc1"
            index: 1
            amount_of_spines: 2
            spine_switch_template: "arista-7050cx3-32c-spine-switch"
            loopback_ipv4_offset: 2
            member_of_groups: ["pods"]
          - name: "infrahub-dc2"
            index: 2
            amount_of_spines: 2
            spine_switch_template: "arista-7050cx3-32c-spine-switch"
            loopback_ipv4_offset: 2
            member_of_groups: ["pods"]
