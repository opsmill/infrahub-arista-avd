---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # paths-filter reads the pull request's file list through the API rather than
  # diffing locally, so the token needs this on top of contents: read.
  pull-requests: read

env:
  UV_FROZEN: "true"
  UV_PYTHON: "3.14.7"

jobs:
  # Classifies the changed files so each job below runs only when it can be
  # affected. Outputs read the `_all` aliases from .github/file-filters.yml.
  files-changed:
    name: Detect which files have changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation: ${{ steps.changes.outputs.documentation_all }}
      python: ${{ steps.changes.outputs.python_all }}
      yaml: ${{ steps.changes.outputs.yaml_all }}
      markdown: ${{ steps.changes.outputs.markdown_all }}
      images: ${{ steps.changes.outputs.images_all }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for file changes
        uses: opsmill/paths-filter@v3.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  image-smoke:
    name: Container image smoke checks
    if: needs.files-changed.outputs.images == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build candidate images
        run: |
          # No --build-arg: the Dockerfile ARG default is the version smoke_images.sh compares against.
          docker build -t avd-infrahub-smoke .
          docker build -f Dockerfile.catalog -t avd-catalog-smoke .
          docker build -t avd-semaphore-smoke semaphore
      - name: Check isolated images
        run: bash scripts/smoke_images.sh avd-infrahub-smoke avd-catalog-smoke avd-semaphore-smoke

  lint:
    name: Lint (ruff, yamllint, mypy)
    # yamllint covers YAML too, so this job runs when either category changed.
    if: needs.files-changed.outputs.python == 'true' || needs.files-changed.outputs.yaml == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Yamllint
        run: uv run yamllint .

      - name: Mypy (src — enforced)
        run: uv run mypy --show-error-codes src/solution_arista_avd

      # Generators and transforms are not yet fully typed. Surface the mypy
      # report for visibility without failing the build until they are cleaned
      # up; remove continue-on-error once the backlog is addressed.
      - name: Mypy (generators, transforms — non-blocking)
        run: uv run mypy --show-error-codes generators transforms
        continue-on-error: true

  markdown-lint:
    name: Markdown lint (rumdl)
    if: needs.files-changed.outputs.markdown == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Rumdl
        run: uv run invoke lint-markdown

  documentation:
    name: Documentation build
    # Docusaurus is configured with onBrokenLinks: 'throw', so this job also
    # serves as the internal link checker.
    if: needs.files-changed.outputs.documentation == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The site is not at the repository root, so the action has to be pointed
      # at its package.json to read the `packageManager` version from it.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Build docs website
        run: uv run invoke docs

  validate-documentation-style:
    name: Documentation prose (Vale)
    if: needs.files-changed.outputs.documentation == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Keep in step with VALE_VERSION in tasks.py.
      VALE_VERSION: "3.17.1"
    steps:
      - uses: actions/checkout@v7

      # Installed by hand: Vale is a Go binary with no PyPI distribution, and the
      # official GitHub Action is unmaintained. The Google and write-good style
      # packages are fetched by `vale sync` rather than vendored.
      - name: Download Vale
        run: |
          curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o vale.tar.gz
          tar -xzf vale.tar.gz vale
          sudo install -m 0755 vale /usr/local/bin/vale

      - name: Validate documentation style
        run: |
          vale sync
          vale docs/docs

  unit-tests:
    name: Unit tests
    if: needs.files-changed.outputs.python == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run unit tests
        run: uv run pytest tests/unit -v

  integration-tests:
    name: Integration tests
    # Runs on demand, and on the pull requests update-infrahub.yml opens to move
    # the Infrahub version (not infrahub-sdk-only bumps). There it blocks the
    # merge, and auto-merge-testcontainers.yml waits for both "Integration tests"
    # jobs to pass.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'update-infrahub-') &&
      !startsWith(github.head_ref, 'update-infrahub-sdk-') &&
      !contains(github.head_ref, '-sdk-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Run integration tests
        run: >-
          uv run pytest tests/integration -m "not e2e"
          --ignore=tests/integration/test_infrahub.py
          --ignore=tests/integration/test_e2e_pipeline.py -v --capture=tee-sys
          --basetemp=/tmp/infrahub-integration-light --durations=0 --durations-min=0
          --junitxml=integration-light-junit.xml

      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-light-evidence
          path: |
            integration-light-junit.xml
            /tmp/infrahub-integration-light/**/instance.log
            /tmp/infrahub-integration-light/**/tasks.json
            /tmp/infrahub-integration-light/**/failed-tasks.json
            /tmp/infrahub-integration-light/**/task-diagnostic-error.txt
            /tmp/infrahub-integration-light/**/log-diagnostic-error.txt

  integration-tests-full:
    name: Integration tests (full stack)
    # The Infrahub testcontainers stack is heavy; run it on demand, and on the
    # pull requests that move the Infrahub version (same rule as above).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'update-infrahub-') &&
      !startsWith(github.head_ref, 'update-infrahub-sdk-') &&
      !contains(github.head_ref, '-sdk-'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Build custom Infrahub image
        run: docker build --build-arg INFRAHUB_BASE_VERSION=1.12.2 -t opsmill/infrahub-solution-arista-avd:1.12.2 .

      # Pin the image so local and CI runs match; tune resources for the ~7GB runner.
      - name: Run full integration tests
        env:
          INFRAHUB_TESTING_DOCKER_IMAGE: "opsmill/infrahub-solution-arista-avd"
          INFRAHUB_TESTING_IMAGE_VER: "1.12.2"
          INFRAHUB_TESTING_DOCKER_PULL: "false"
          INFRAHUB_TESTING_WEB_CONCURRENCY: "2"
          INFRAHUB_TESTING_API_SERVER_COUNT: "1"
          INFRAHUB_TESTING_TASK_WORKER_COUNT: "2"
          INFRAHUB_TESTING_TASKMGR_BACKGROUND_SVC_REPLICAS: "1"
          # Generators issue large GraphQL reads; raise the client timeout above
          # the 60s default so a busy server does not trip a false failure.
          INFRAHUB_TIMEOUT: "300"
        run: >-
          uv run --no-sync pytest tests/integration -v --capture=tee-sys
          --basetemp=/tmp/infrahub-integration --durations=0 --durations-min=0
          --junitxml=integration-junit.xml

      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-evidence
          path: |
            integration-junit.xml
            /tmp/infrahub-integration/**/instance.log
            /tmp/infrahub-integration/**/tasks.json
            /tmp/infrahub-integration/**/failed-tasks.json
            /tmp/infrahub-integration/**/rack-pass-*.json
            /tmp/infrahub-integration/**/task-diagnostic-error.txt
            /tmp/infrahub-integration/**/log-diagnostic-error.txt
