---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "true"

jobs:
  lint:
    name: Lint (ruff, yamllint, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Yamllint
        run: uv run yamllint .

      - name: Mypy (src — enforced)
        run: uv run mypy --show-error-codes src/solution_arista_avd

      # Generators and transforms are not yet fully typed. Surface the mypy
      # report for visibility without failing the build until they are cleaned
      # up; remove continue-on-error once the backlog is addressed.
      - name: Mypy (generators, transforms — non-blocking)
        run: uv run mypy --show-error-codes generators transforms
        continue-on-error: true

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run unit tests
        run: uv run pytest tests/unit -v

  integration-tests:
    name: Integration tests
    # Run on demand only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run integration tests
        run: >-
          uv run pytest tests/integration -m "not e2e"
          --ignore=tests/integration/test_infrahub.py
          --ignore=tests/integration/test_e2e_pipeline.py -v

  integration-tests-full:
    name: Integration tests (full stack)
    # The Infrahub testcontainers stack is heavy; run it on demand only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Build custom Infrahub image
        run: docker build --build-arg INFRAHUB_BASE_VERSION=1.10.3 -t opsmill/infrahub-solution-arista-avd:1.10.3 .

      # Pin the image so local and CI runs match; tune resources for the ~7GB runner.
      - name: Run full integration tests
        env:
          INFRAHUB_TESTING_DOCKER_IMAGE: "opsmill/infrahub-solution-arista-avd"
          INFRAHUB_TESTING_IMAGE_VER: "1.10.3"
          INFRAHUB_TESTING_DOCKER_PULL: "false"
          INFRAHUB_TESTING_WEB_CONCURRENCY: "2"
          INFRAHUB_TESTING_API_SERVER_COUNT: "1"
          # Generators issue large GraphQL reads; raise the client timeout above
          # the 60s default so a busy server does not trip a false failure.
          INFRAHUB_TIMEOUT: "300"
        run: uv run pytest tests/integration/test_infrahub.py tests/integration/test_e2e_pipeline.py -v
