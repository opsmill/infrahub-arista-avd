---
# yamllint disable rule:truthy
name: Publish sandbox images

# Publishes the two images the public sandbox runs to OpsMill's Harbor registry:
#
# - task-worker: the Infrahub image with the solution_arista_avd package that the
#   generators, transforms and checks import. The sandbox sets it as the image of
#   the built-in `task-worker` component.
# - service-catalog: the Streamlit service portal, run as a generic-app.
#
# The registry host comes from the HARBOR_HOST repository variable and the
# credentials from the HARBOR_USERNAME and HARBOR_PASSWORD secrets, as in the
# other OpsMill repositories that publish to Harbor.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - Dockerfile.catalog
      - pyproject.toml
      - uv.lock
      - README.md
      - src/**
      - service_catalog/**
      - .github/workflows/publish-images.yml
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: task-worker
            dockerfile: Dockerfile
          - image: service-catalog
            dockerfile: Dockerfile.catalog
    steps:
      - uses: actions/checkout@v7

      - name: Read the Infrahub base version from the Dockerfile
        id: base
        run: |
          version=$(sed -n 's/^ARG INFRAHUB_BASE_VERSION=//p' Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.HARBOR_HOST }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=infrahub-${{ steps.base.outputs.version }},enable=${{ matrix.image == 'task-worker' && github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
