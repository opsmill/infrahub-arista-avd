---
apiVersion: infrahub.app/v1
kind: Menu
spec:
  data:
    - namespace: Network
      name: MainMenu
      label: Network
      icon: "mdi:domain"
      kind: OrganizationGeneric
      children:
        data:
          - namespace: Network
            name: Fabric
            label: Fabrics
            kind: NetworkFabric
            icon: "lucide:network"

          - namespace: Network
            name: Pod
            label: Pods
            kind: NetworkPod
            icon: "clarity:pod-line"

          - namespace: Network
            name: Device
            label: Devices
            kind: NetworkDevice
            icon: "mdi:server"

          - namespace: Network
            name: DeviceType
            label: Device Types
            kind: NetworkDeviceType
            icon: "mdi:server"

          - namespace: Network
            name: Link
            label: Connections
            kind: NetworkLink
            icon: "material-symbols:cable"

    - namespace: Location
      name: Menu
      label: Location
      kind: LocationGeneric
      icon: "mingcute:location-line"
      children:
        data:
          - namespace: Location
            name: Hall
            label: Hall
            kind: LocationHall
            icon: "mdi:building"

          - namespace: Location
            name: Rack
            label: Rack
            kind: LocationRack
            icon: "clarity:rack-server-solid"

    - namespace: Routing
      name: Menu
      label: Routing
      icon: "mdi:router"
      children:
        data:
          - namespace: Routing
            name: BGPPeerGroup
            label: BGP Peer Groups
            kind: RoutingBGPPeerGroup
            icon: "mdi:router"

          - namespace: Routing
            name: BGPNeighbor
            label: BGP Neighbors
            kind: RoutingBGPNeighbor
            icon: "mdi:connection"

          - namespace: Routing
            name: PrefixList
            label: Prefix Lists
            kind: RoutingPrefixList
            icon: "mdi:format-list-bulleted"

          - namespace: Routing
            name: RouteMap
            label: Route Maps
            kind: RoutingRouteMap
            icon: "mdi:map-outline"

          - namespace: Routing
            name: StaticRoute
            label: Static Routes
            kind: RoutingStaticRoute
            icon: "mdi:routes"

    - namespace: Organization
      name: Menu
      label: Organization
      icon: "mdi:domain"
      children:
        data:
          - namespace: Organization
            name: Manufacturer
            label: Manufacturer
            kind: OrganizationManufacturer
            icon: "mdi:domain"
