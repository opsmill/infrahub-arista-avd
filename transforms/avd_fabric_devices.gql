query AvdFabricDevicesQuery($name: String!) {
  NetworkFabric(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
      }
    }
  }
  DcimDevice {
    edges {
      node {
        id
        name {
          value
        }
        pod {
          node {
            id
            parent {
              node {
                __typename
                id
              }
            }
          }
        }
        avd_artifact {
          node {
            id
            hostvar_file {
              node {
                id
              }
            }
            structured_config_file {
              node {
                id
              }
            }
          }
        }
      }
    }
  }
}
