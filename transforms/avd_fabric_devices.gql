query AvdFabricDevicesQuery($name: String!) {
  NetworkFabric(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
      }
    }
  }
  NetworkDevice {
    edges {
      node {
        id
        hostname {
          value
        }
        pod {
          node {
            id
            parent {
              node {
                __typename
                id
              }
            }
          }
        }
        avd_artifact {
          node {
            hostvar_identifier {
              value
            }
            structured_config_checksum {
              value
            }
            structured_config_identifier {
              value
            }
          }
        }
      }
    }
  }
}
