query AvdDeviceConfigQuery($name: String!) {
  DcimDevice(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        avd_artifact {
          node {
            structured_config_checksum {
              value
            }
            structured_config_identifier {
              value
            }
          }
        }
      }
    }
  }
}
