query AvdAntaCatalogQuery($name: String!) {
  # Keep the fabric-level ANTA settings as a direct query root. Infrahub's
  # proposed-change impact analyzer does not attribute fields selected only
  # inside the pod.parent union fragment to NetworkFabric. Without this root,
  # changing anta_enabled or avd_catalogs_filters selects the artifact
  # definition but does not re-render any existing device catalog.
  anta_fabrics: NetworkFabric {
    edges {
      node {
        id
        anta_enabled {
          value
        }
        avd_catalogs_filters {
          value
        }
      }
    }
  }
  target: DcimDevice(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        pod {
          node {
            id
            parent {
              node {
                __typename
                id
                ... on NetworkFabric {
                  name {
                    value
                  }
                  anta_enabled {
                    value
                  }
                  avd_catalogs_filters {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  DcimDevice {
    edges {
      node {
        id
        name {
          value
        }
        pod {
          node {
            id
            parent {
              node {
                __typename
                id
              }
            }
          }
        }
        avd_artifact {
          node {
            id
            structured_config_file {
              node {
                id
              }
            }
          }
        }
      }
    }
  }
}
