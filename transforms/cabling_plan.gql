query FabricCablingPlanQuery($name: String!) {
  NetworkFabric(name__value: $name) {
    edges {
      node {
        __typename
        children {
          edges {
            node {
              __typename
              id
              ... on NetworkPod {
                devices {
                  edges {
                    node {
                      __typename
                      id
                      rack {
                        node {
                          __typename
                          id
                        }
                      }
                      interfaces {
                        edges {
                          node {
                            __typename
                            id
                            ... on InterfacePhysical {
                              connector {
                                node {
                                  __typename
                                  id
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
                racks {
                  edges {
                    node {
                      __typename
                      id
                      devices {
                        edges {
                          node {
                            __typename
                            id
                            ... on DcimDevice {
                              rack {
                                node {
                                  __typename
                                  id
                                }
                              }
                              interfaces {
                                edges {
                                  node {
                                    __typename
                                    id
                                    ... on DcimEndpoint {
                                      connector {
                                        node {
                                          __typename
                                          id
                                        }
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
