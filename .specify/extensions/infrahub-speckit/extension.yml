schema_version: "1.0"

extension:
  id: infrahub-speckit
  name: "Infrahub Workflow Routing"
  version: "3.0.1"
  description: "Routes speckit specify/plan/implement to Infrahub artifact skills via pre-execution hooks and ships Infrahub spec templates."
  author: opsmill
  repository: "https://github.com/opsmill/infrahub-speckit"
  license: Apache-2.0

requires:
  speckit_version: ">=0.8.0"

provides:
  templates:
    - name: "spec-schema-template"
      file: "templates/spec-schema-template.md"
      description: "Schema design specification template"
    - name: "spec-objects-template"
      file: "templates/spec-objects-template.md"
      description: "Object population specification template"
    - name: "spec-check-template"
      file: "templates/spec-check-template.md"
      description: "Validation check specification template"
    - name: "spec-generator-template"
      file: "templates/spec-generator-template.md"
      description: "Design-driven generator specification template"
    - name: "spec-transform-template"
      file: "templates/spec-transform-template.md"
      description: "Data transform specification template"
    - name: "spec-menu-template"
      file: "templates/spec-menu-template.md"
      description: "UI menu customization specification template"
  commands:
    - name: speckit.infrahub-speckit.route-specify
      file: commands/speckit.infrahub-speckit.route-specify.md
      description: "Detect .infrahub.yml, classify artifact, gate Infrahub skill invocation, select Infrahub spec template."
    - name: speckit.infrahub-speckit.route-plan
      file: commands/speckit.infrahub-speckit.route-plan.md
      description: "Gate Infrahub skill invocation before plan."
    - name: speckit.infrahub-speckit.route-implement
      file: commands/speckit.infrahub-speckit.route-implement.md
      description: "Gate Infrahub skill invocation before implement."

hooks:
  before_specify:
    command: speckit.infrahub-speckit.route-specify
    optional: false
    description: "Infrahub artifact routing before specification"
  before_plan:
    command: speckit.infrahub-speckit.route-plan
    optional: false
    description: "Infrahub artifact routing before planning"
  before_implement:
    command: speckit.infrahub-speckit.route-implement
    optional: false
    description: "Infrahub artifact routing before implementation"

tags:
  - "infrahub"
  - "infrastructure"
  - "routing"
  - "opsmill"
