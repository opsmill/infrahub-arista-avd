---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreGraphQLQuery
  data:
    - name: cv_config_check
      repository: test-repository
      query: |
        query CVConfigCheck($name: String!) {
          NetworkFabric(name__value: $name) {
            edges {
              node {
                id
                name {
                  value
                }
                cloudvision_managed {
                  value
                }
              }
            }
          }
          DcimDevice {
            edges {
              node {
                id
                name {
                  value
                }
                serial {
                  value
                }
                pod {
                  node {
                    id
                    parent {
                      node {
                        __typename
                        id
                      }
                    }
                  }
                }
                avd_artifact {
                  node {
                    id
                    structured_config_file {
                      node {
                        id
                      }
                    }
                  }
                }
              }
            }
          }
        }
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreCheckDefinition
  data:
    - name: cv-config-validation
      repository: test-repository
      file_path: "./checks/cv_config_check.py"
      class_name: CVConfigValidationCheck
      timeout: 600
      targets: fabrics
      query: cv_config_check
      parameters:
        name: name__value
