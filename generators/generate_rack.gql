query RackGeneratorQuery($name: String!) {
  LocationRack(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        checksum {
          value
        }
				index {
					value
				}
				rack_type {
					value
				}
				mlag {
					value
				}
				device_designs {
					edges {
						node {
							role {
								value
							}
							device_quantity {
								value
							}
							device_template {
								node {
									__typename
									id
								}
							}
						}
					}
				}
				parent {
					node {
						__typename
						id
						name {
							value
						}
					}
				}
				pod {
					node {
						id
						name {
							value
						}
						index {
							value
						}
						device_designs {
							edges {
								node {
									role {
												value
									}
									device_quantity {
												value
									}
									device_template {
												node {
													__typename
													id
												}
									}
								}
							}
						}
						leaf_interface_sorting_method {
							value
						}
						spine_interface_sorting_method {
							value
						}
						pod_ip_pools {
							edges {
								node {
									__typename
									id
									... on CoreIPAddressPool {
										resources {
											edges {
												node {
													__typename
													... on IpamPrefix {
														id
														prefix {
															value
														}
														role {
															value
														}
													}
												}
											}
										}
									}
									... on CoreIPPrefixPool {
										resources {
											edges {
												node {
													__typename
													... on IpamPrefix {
														id
														prefix {
															value
														}
														role {
															value
														}
													}
												}
											}
										}
									}
								}
							}
						}
						parent {
							node {
								__typename
								... on NetworkFabric {
									name {
										value
									}
									underlay_routing_protocol {
										value
									}
									asn_pool {
										node {
											id
										}
									}
									node_id_pool {
										node {
											id
										}
									}
									mgmt_pool {
										node {
											id
										}
									}
									fabric_ip_pools {
										edges {
											node {
												__typename
												id
												... on CoreIPAddressPool {
													resources {
														edges {
															node {
																__typename
																... on IpamPrefix {
																	id
																	prefix {
																		value
																	}
																	role {
																		value
																	}
																}
															}
														}
													}
												}
												... on CoreIPPrefixPool {
													resources {
														edges {
															node {
																__typename
																... on IpamPrefix {
																	id
																	prefix {
																		value
																	}
																	role {
																		value
																	}
																}
															}
														}
													}
												}
											}
										}
									}
									vtep_pool {
										node {
											id
											resources {
												edges {
													node {
														__typename
														id
													}
												}
											}
										}
									}
									loopback_pool {
										node {
											id
											resources {
												edges {
													node {
														__typename
														id
													}
												}
											}
										}
									}
								}
							}
						}
					}
				}
      }
    }
  }
}
