query FabricGeneratorQuery($name: String!) {
  NetworkFabric(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        underlay_routing_protocol {
          value
        }
        device_designs {
          edges {
            node {
              role {
                value
              }
              device_quantity {
                value
              }
              device_template {
                node {
                  __typename
                  id
                }
              }
            }
          }
        }
        mgmt_gateway {
          value
        }
        asn_pool {
          node {
            id
          }
        }
        node_id_pool {
          node {
            id
          }
        }
        mgmt_pool {
          node {
            id
          }
        }
        fabric_ip_pools {
          edges {
            node {
              __typename
              id
              ... on CoreIPAddressPool {
                resources {
                  edges {
                    node {
                      __typename
                      ... on IpamPrefix {
                        role {
                          value
                        }
                      }
                    }
                  }
                }
              }
              ... on CoreIPPrefixPool {
                resources {
                  edges {
                    node {
                      __typename
                      ... on IpamPrefix {
                        role {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        vtep_pool {
          node {
            id
            resources {
              edges {
                node {
                  __typename
                  id
                }
              }
            }
          }
        }
        loopback_pool {
          node {
            id
            resources {
              edges {
                node {
                  __typename
                  id
                }
              }
            }
          }
        }
      }
    }
  }
}
