query BackfillStructuredConfigQuery($name: String!) {
  AvdArtifact(name__value: $name) {
    edges {
      node {
        id
        structured_config_file {
          node {
            id
          }
        }
        device {
          node {
            __typename
            id
            ... on DcimDevice {
              name {
                value
              }
              role {
                value
              }
              interfaces {
                edges {
                  node {
                    __typename
                    id
                    name {
                      value
                    }
                    role {
                      value
                    }
                    mtu {
                      value
                    }
                    ip_address {
                      node {
                        id
                        address {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
