query PodGeneratorQuery($name: String!) {
  NetworkPod(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        checksum {
          value
        }
        index {
          value
        }
        role {
          value
        }
        device_designs {
          edges {
            node {
              role {
                value
              }
              device_quantity {
                value
              }
              device_template {
                node {
                  __typename
                  id
                }
              }
            }
          }
        }
        pod_ip_pools {
          edges {
            node {
              __typename
              id
              ... on CoreIPAddressPool {
                resources {
                  edges {
                    node {
                      __typename
                      ... on IpamPrefix {
                        id
                        prefix {
                          value
                        }
                        role {
                          value
                        }
                      }
                    }
                  }
                }
              }
              ... on CoreIPPrefixPool {
                resources {
                  edges {
                    node {
                      __typename
                      ... on IpamPrefix {
                        id
                        prefix {
                          value
                        }
                        role {
                          value
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
        parent {
          node {
            __typename
            id
            name {
              value
            }
            ... on NetworkFabric {
              underlay_routing_protocol {
                value
              }
              fabric_interface_sorting_method {
                value
              }
              spine_interface_sorting_method {
                value
              }
              device_designs {
                edges {
                  node {
                    role {
                      value
                    }
                    device_quantity {
                      value
                    }
                    device_template {
                      node {
                        __typename
                        id
                      }
                    }
                  }
                }
              }
              asn_pool {
                node {
                  id
                }
              }
              node_id_pool {
                node {
                  id
                }
              }
              mgmt_pool {
                node {
                  id
                }
              }
              fabric_ip_pools {
                edges {
                  node {
                    __typename
                    id
                    ... on CoreIPAddressPool {
                      resources {
                        edges {
                          node {
                            __typename
                            ... on IpamPrefix {
                              id
                              prefix {
                                value
                              }
                              role {
                                value
                              }
                            }
                          }
                        }
                      }
                    }
                    ... on CoreIPPrefixPool {
                      resources {
                        edges {
                          node {
                            __typename
                            ... on IpamPrefix {
                              id
                              prefix {
                                value
                              }
                              role {
                                value
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
              vtep_pool {
                node {
                  id
                  resources {
                    edges {
                      node {
                        __typename
                        id
                      }
                    }
                  }
                }
              }
              loopback_pool {
                node {
                  id
                  resources {
                    edges {
                      node {
                        __typename
                        id
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
