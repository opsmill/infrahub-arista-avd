query GenerateAvdDeviceInputsQuery($name: String!) {
  DcimDevice(name__value: $name) {
    edges {
      node {
        __typename
        id
        name {
          value
        }
        role {
          value
        }
        bgp_asn {
          value
        }
        node_id {
          value
        }
        loopback_ip {
          node {
            __typename
            id
            address {
              value
            }
          }
        }
        mgmt_ip {
          node {
            __typename
            id
            address {
              value
            }
          }
        }
        pod {
          node {
            id
            name {
              value
            }
            parent {
              node {
                __typename
                id
                name {
                  value
                }
                ... on NetworkFabric {
                  mgmt_gateway {
                    value
                  }
                  mgmt_routes {
                    value
                  }
                  avd_evpn {
                    node {
                      __typename
                      ebgp_multihop {
                        value
                      }
                      overlay_bgp_rtc {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
        interfaces {
          edges {
            node {
              __typename
              id
              ... on InterfacePhysical {
                name {
                  value
                }
                role {
                  value
                }
                tagged_vlan {
                  edges {
                    node {
                      __typename
                      vlan_id {
                        value
                      }
                      status {
                        value
                      }
                    }
                  }
                }
                untagged_vlan {
                  node {
                    __typename
                    vlan_id {
                      value
                    }
                    status {
                      value
                    }
                  }
                }
                connector {
                  node {
                    __typename
                    id
                    connected_endpoints {
                      edges {
                        node {
                          __typename
                          id
                          ... on DcimInterface {
                            name {
                              value
                            }
                            device {
                              node {
                                __typename
                                id
                                name {
                                  value
                                }
                                ... on DcimDevice {
                                  role {
                                    value
                                  }
                                }
                              }
                            }
                          }
                          ... on InterfacePhysical {
                            name {
                              value
                            }
                            device {
                              node {
                                __typename
                                id
                                name {
                                  value
                                }
                                ... on DcimDevice {
                                  role {
                                    value
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
