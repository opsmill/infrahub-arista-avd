query GenerateAvdDeviceInputsQuery($name: String!) {
  DcimDevice(name__value: $name) {
    edges {
      node {
        __typename
        id
        name {
          value
        }
        role {
          value
        }
        asn {
          node {
            asn {
              value
            }
          }
        }
        node_id {
          value
        }
        avd_custom_hostvars {
          value
        }
        loopback_ip {
          node {
            __typename
            id
            address {
              value
            }
          }
        }
        mgmt_ip {
          node {
            __typename
            id
            address {
              value
            }
          }
        }
        mlag_domain {
          node {
            __typename
            id
            domain_id {
              value
            }
            asn {
              node {
                asn {
                  value
                }
              }
            }
            virtual_router_mac {
              value
            }
            peers {
              edges {
                node {
                  __typename
                  id
                  name {
                    value
                  }
                }
              }
            }
          }
        }
        rack {
          node {
            __typename
            id
            name {
              value
            }
            mlag {
              value
            }
            devices {
              edges {
                node {
                  __typename
                  id
                  ... on DcimDevice {
                    name {
                      value
                    }
                    role {
                      value
                    }
                  }
                }
              }
            }
          }
        }
        pod {
          node {
            id
            name {
              value
            }
            mlag_peer_pool {
              node {
                id
                name {
                  value
                }
              }
            }
            mlag_l3_pool {
              node {
                id
                name {
                  value
                }
              }
            }
            loopback_ipv4_offset {
              value
            }
            avd_custom_hostvars {
              value
            }
            parent {
              node {
                __typename
                id
                name {
                  value
                }
                ... on NetworkFabric {
                  mgmt_gateway {
                    value
                  }
                  mgmt_routes {
                    value
                  }
                  virtual_router_mac {
                    value
                  }
                  underlay_routing_protocol {
                    value
                  }
                  overlay_routing_protocol {
                    value
                  }
                  p2p_uplinks_mtu {
                    value
                  }
                  uplink_pool {
                    node {
                      id
                      name {
                        value
                      }
                      default_prefix_length {
                        value
                      }
                    }
                  }
                  vtep_pool {
                    node {
                      id
                      name {
                        value
                      }
                      default_prefix_length {
                        value
                      }
                    }
                  }
                  loopback_pool {
                    node {
                      id
                      name {
                        value
                      }
                      default_prefix_length {
                        value
                      }
                    }
                  }
                  spanning_tree_mode {
                    value
                  }
                  spanning_tree_priority {
                    value
                  }
                  bgp_evpn_overlay_password {
                    value
                  }
                  bgp_underlay_password {
                    value
                  }
                  bgp_mlag_password {
                    value
                  }
                  dns_servers {
                    edges {
                      node {
                        name { value }
                        ip_address { value }
                        vrf { value }
                      }
                    }
                  }
                  ntp_servers {
                    edges {
                      node {
                        name { value }
                        server_vrf { value }
                      }
                    }
                  }
                  local_users {
                    edges {
                      node {
                        name { value }
                        privilege { value }
                        role { value }
                        password_type { value }
                        password { value }
                      }
                    }
                  }
                  avd_evpn {
                    node {
                      __typename
                      ebgp_multihop {
                        value
                      }
                      overlay_bgp_rtc {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
        interfaces {
          edges {
            node {
              __typename
              id
              ... on InterfacePhysical {
                name {
                  value
                }
                role {
                  value
                }
                tagged_vlan {
                  edges {
                    node {
                      __typename
                      vlan_id {
                        value
                      }
                      status {
                        value
                      }
                    }
                  }
                }
                untagged_vlan {
                  node {
                    __typename
                    vlan_id {
                      value
                    }
                    status {
                      value
                    }
                  }
                }
                connector {
                  node {
                    __typename
                    id
                    connected_endpoints {
                      edges {
                        node {
                          __typename
                          id
                          ... on DcimInterface {
                            name {
                              value
                            }
                            device {
                              node {
                                __typename
                                id
                                name {
                                  value
                                }
                                ... on DcimDevice {
                                  role {
                                    value
                                  }
                                }
                              }
                            }
                          }
                          ... on InterfacePhysical {
                            name {
                              value
                            }
                            lag {
                              node {
                                __typename
                                id
                                name {
                                  value
                                }
                                ... on InterfaceLag {
                                  lacp_mode {
                                    value
                                  }
                                }
                              }
                            }
                            device {
                              node {
                                __typename
                                id
                                name {
                                  value
                                }
                                ... on DcimDevice {
                                  role {
                                    value
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
