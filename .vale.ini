StylesPath = .vale

MinAlertLevel = warning

Packages = Google, write-good

# Activates .vale/config/vocabularies/OpsMill/accept.txt. Without this the
# vocabulary file is present but ignored.
Vocab = OpsMill

[*.{md,mdx}]
BasedOnStyles = Vale, Google, write-good

# Explicit heading anchors ({#some-slug}) are identifiers kept for link
# stability, not prose. Without this, a word preserved only inside an anchor is
# still reported. Must sit in this syntax section, not at the top level.
TokenIgnores = (\{#[^}]+\})

# Google style forbids the spaced em dash. This documentation uses it throughout
# as a deliberate voice choice, and enforcing the rule would mean rewriting 241
# sentences rather than fixing defects.
Google.EmDash = NO

# Passive voice is frequently the correct register for technical reference prose
# ("the artifact is rendered from the stored files"). Flagging every instance
# produces noise, not improvements.
write-good.Passive = NO

# A subjective phrase blacklist that disagrees with precise technical wording
# more often than it improves it.
write-good.TooWordy = NO

# Wants the first word after a colon lowercased, which here means schema kind
# and generator names: it reports that 'NetworkFabric' and 'DcimDevice' "should
# be in lowercase". Following it would make the documentation factually wrong.
Google.Colons = NO

# Written for consumer product documentation, so it insists 'CLI' becomes
# 'command-line tool'. This is developer reference material for infrahubctl,
# where CLI is the precise and expected term.
Google.WordList = NO

# Same origin, same mismatch: it proposes 'tap' for 'touch' (the Unix command),
# 'app' for 'application', and 'media type' for 'content type'.
Google.WordListCase = NO

# Enforces one exact casing for every vocabulary entry and cannot tell a
# sentence-initial capital from a casing error, so it reported every heading
# opening with 'Hostvars' or 'Config'. Listing both casings makes it worse, since
# each entry then flags the other. Terminology casing is reviewed by hand
# instead - doing so is what surfaced the PyAVD/pyAVD inconsistency this change
# corrects.
Vale.Terms = NO

# Reads the ordinal in a numbered step heading ('## 1. Install dependencies') as
# a heading that ends in a period. The quick start's numbered steps are
# deliberate, and renumbering them would change five published heading anchors.
Google.HeadingPunctuation = NO
