---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
# Adopted from opsmill/schema-library extensions/mlag with project adaptations
version: "1.0"

generics:
  - name: MlagDomain
    namespace: Generic
    include_in_menu: false
    label: MLAG Domain
    display_label: domain_id__value
    human_friendly_id:
      - domain_id__value
    attributes:
      - name: domain_id
        label: "MLAG Domain ID"
        kind: Text
        unique: true
        description: "Identifier for the MLAG domain"
        order_weight: 900
      - name: reload_delay
        label: "Reload Delay"
        kind: Number
        description: "Time in seconds to wait before bringing up the MLAG after a reload"
        default_value: 300
        order_weight: 1650
    relationships:
      - name: peer_links
        label: "Peer Links"
        description: "LAG interfaces used as peer-links between the MLAG peers"
        peer: InterfaceLag
        cardinality: many
        kind: Attribute
        order_weight: 1500
      - name: mlag_interfaces
        label: "MLAG Interface(s)"
        peer: MlagInterface
        cardinality: many
        kind: Component
        description: "Bundle interfaces that are spread across all devices in this MLAG domain."
        order_weight: 1500

nodes:
  - name: Interface
    namespace: Mlag
    label: MLAG Interface
    description: "Multi-Chassis Link Aggregation Group Interface"
    inherit_from:
      - InterfaceLayer2
      - GenericInterfaceBundle
    include_in_menu: false
    uniqueness_constraints:
      - [mlag_domain, name__value]
    human_friendly_id:
      - mlag_domain__domain_id__value
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        description: "Name of the interface"
        order_weight: 1000
      - name: mlag_id
        label: "MLAG ID"
        kind: Number
        description: "Identifier for the MLAG interface"
        order_weight: 1050
      - name: description
        kind: Text
        optional: true
        description: "A brief description of the interface"
        order_weight: 1100
      - name: status
        kind: Dropdown
        description: "The status of the interface"
        choices:
          - name: provisioning
            label: Provisioning
            color: "#A9DFBF"
          - name: free
            label: Free
            color: "#CDEACC"
          - name: active
            label: Active
            color: "#A9CCE3"
          - name: maintenance
            label: Maintenance
            color: "#FFF2CC"
          - name: disabled
            label: Disabled
            color: "#D3D3D3"
          - name: deleted
            label: Deleted
            color: "#FAD7A0"
          - name: outage
            label: Outage
            color: "#F4CCCC"
        default_value: "active"
        order_weight: 1200
      - name: role
        kind: Dropdown
        optional: true
        description: "The role of the interface in the network"
        choices:
          - name: server
            label: Server Interface
            description: "Interface connecting servers"
            color: "#A9DFBF"
          - name: router
            label: Router Interface
            description: "Interface connecting routers"
            color: "#B2D4E6"
        order_weight: 1250
    relationships:
      - name: mlag_domain
        label: "MLAG Domain"
        peer: GenericMlagDomain
        optional: false
        cardinality: one
        kind: Parent
        description: "MLAG Domain this MLAG Interface belongs to"
        order_weight: 1750

  - name: Domain
    namespace: Mlag
    label: MLAG Domain
    description: "MLAG (Multi-Chassis Link Aggregation Group) Domain"
    icon: mingcute:cloud-line
    include_in_menu: false
    inherit_from:
      - GenericMlagDomain
    relationships:
      - name: peers
        peer: DcimDevice
        optional: false
        cardinality: many
        kind: Generic
        identifier: device__mlag_domain
        max_count: 2
        min_count: 2
        order_weight: 950

extensions:
  nodes:
    - kind: InterfaceLag
      relationships:
        - name: mlag_peer_link
          label: "MLAG Peer Link"
          peer: MlagDomain
          optional: true
          cardinality: one
          kind: Attribute
          description: "MLAG Domain this LAG is used as peer link"
          order_weight: 1800
    - kind: DcimDevice
      relationships:
        - name: mlag_domain
          label: "MLAG Domain"
          peer: MlagDomain
          optional: true
          cardinality: one
          kind: Attribute
          description: "MLAG Domain this device belongs to"
          order_weight: 1800
          identifier: device__mlag_domain
