---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

nodes:
  - name: Artifact
    namespace: Avd
    include_in_menu: true
    display_label: name__value
    human_friendly_id:
      - name__value
    uniqueness_constraints:
      - [device, name__value]
    attributes:
      - name: name
        kind: Text
        unique: true
        order_weight: 100
      - name: hostvar_checksum
        kind: Text
        state: absent
      - name: hostvar_identifier
        kind: Text
        state: absent
      - name: hostvar_url
        kind: URL
        state: absent
      - name: structured_config_checksum
        kind: Text
        state: absent
      - name: structured_config_identifier
        kind: Text
        state: absent
      - name: structured_config_url
        kind: URL
        state: absent
    relationships:
      - name: device
        peer: DcimDevice
        kind: Attribute
        cardinality: one
        optional: false
      - name: hostvar_file
        peer: AvdHostvarFile
        kind: Component
        cardinality: one
        optional: true
        identifier: "avdartifact__hostvar_file"
        order_weight: 900
      - name: structured_config_file
        peer: AvdStructuredConfigFile
        kind: Component
        cardinality: one
        optional: true
        identifier: "avdartifact__structured_config_file"
        order_weight: 950

  - name: HostvarFile
    namespace: Avd
    description: "Stores per-device pyAVD hostvars as a JSON file"
    include_in_menu: false
    inherit_from:
      - CoreFileObject
    human_friendly_id:
      - "artifact__name__value"
    uniqueness_constraints:
      - ["artifact"]
    relationships:
      - name: artifact
        peer: AvdArtifact
        kind: Parent
        cardinality: one
        optional: false
        identifier: "avdartifact__hostvar_file"

  - name: StructuredConfigFile
    namespace: Avd
    description: "Stores per-device AVD structured configuration as a JSON file"
    include_in_menu: false
    inherit_from:
      - CoreFileObject
    human_friendly_id:
      - "artifact__name__value"
    uniqueness_constraints:
      - ["artifact"]
    relationships:
      - name: artifact
        peer: AvdArtifact
        kind: Parent
        cardinality: one
        optional: false
        identifier: "avdartifact__structured_config_file"
