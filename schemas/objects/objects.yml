---
version: "1.0"

nodes:
  - name: Artifact
    namespace: Avd
    include_in_menu: true
    display_label: name__value
    human_friendly_id:
      - name__value
    uniqueness_constraints:
      - [device, name__value]
    attributes:
      - name: name
        kind: Text
        order_weight: 100
      - name: hostvar_checksum
        kind: Text
        optional: true
        order_weight: 100
      - name: hostvar_identifier
        kind: Text
        optional: true
        order_weight: 200
      - name: hostvar_url
        label: AVD Hostvar URL
        kind: URL
        optional: true
        read_only: true
        description: "URL to retrieve the AVD hostvar file from InfraHub Storage."
        computed_attribute:
          kind: Jinja2
          jinja2_template: "http://localhost:8000/api/storage/object/{{ hostvar_identifier__value }}"
      - name: structured_config_checksum
        kind: Text
        optional: true
        order_weight: 100
      - name: structured_config_identifier
        kind: Text
        optional: true
        order_weight: 200
      - name: structured_config_url
        label: AVD Structured Config URL
        kind: URL
        optional: true
        read_only: true
        description: "URL to retrieve the AVD structured config file from InfraHub Storage."
        computed_attribute:
          kind: Jinja2
          jinja2_template: "http://localhost:8000/api/storage/object/{{ structured_config_identifier__value }}"
    relationships:
      - name: device
        peer: DcimDevice
        kind: Attribute
        cardinality: one
        optional: false
