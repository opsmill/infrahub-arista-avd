---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

nodes:
  - name: DciLink
    namespace: Network
    description: "Point-to-point DCI connection between Border Leaf devices"
    label: DCI Link
    icon: mdi:transit-connection-variant
    include_in_menu: false
    inherit_from:
      - DcimConnector
    human_friendly_id:
      - name__value
    display_label: name__value
    order_by:
      - name__value
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: include_in_underlay_protocol
        label: Include in Underlay Protocol
        kind: Boolean
        optional: false
        default_value: true
        description: "Whether this DCI link participates in the generated underlay routing protocol."
        order_weight: 1100
      - name: endpoint_1_bgp_asn
        label: Endpoint 1 BGP ASN
        kind: Number
        optional: true
        description: "BGP ASN for the first endpoint after deterministic endpoint ordering."
        order_weight: 1200
      - name: endpoint_2_bgp_asn
        label: Endpoint 2 BGP ASN
        kind: Number
        optional: true
        description: "BGP ASN for the second endpoint after deterministic endpoint ordering."
        order_weight: 1300

extensions:
  nodes:
    - kind: NetworkFabric
      relationships:
        - name: dci_pool
          label: DCI IP Pool
          peer: CoreIPPrefixPool
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "fabric__dci_pool"
          description: "IP prefix pool used to allocate /31 point-to-point prefixes for DCI links."
          order_weight: 10700
