# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
---
version: "1.0"

nodes:
  - name: Link
    namespace: Network
    description: "A physical cable or connection between two endpoints"
    label: Network Link
    icon: mdi:cable-data
    include_in_menu: false
    inherit_from:
      - DcimConnector
    human_friendly_id:
      - name__value
    display_label: name__value

extensions:
  nodes:
    - kind: DcimDevice
      attributes:
        - name: index
          kind: Number
          optional: true
        - name: role
          kind: Dropdown
          optional: true
          order_weight: 1400
          choices:
            - name: super_spine
              label: Super spine
            - name: spine
              label: Spine
            - name: leaf
              label: Leaf
            - name: l2leaf
              label: L2 Leaf
              description: "L2 Leaf Switch (access layer, no EVPN)"
              color: "#f0e6fa"
        - name: node_id
          label: Node ID
          kind: Number
          optional: true
        - name: avd_custom_hostvars
          label: AVD Custom Hostvars
          kind: JSON
          optional: true
          description: >-
            Escape hatch for pyAVD hostvars not yet modeled by Infrahub schemas/generators. Applies only to this
            device; generated hostvars take precedence.
      relationships:
        - name: loopback_ip
          peer: IpamIPAddress
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "device__ip_address"
        - name: mgmt_ip
          label: Management IP
          peer: IpamIPAddress
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "device__mgmt_ip"
        - name: rack
          peer: LocationRack
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "rack__device"
        - name: pod
          peer: NetworkPod
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "pod__device"
        - name: asn
          label: BGP ASN
          peer: RoutingAsn
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "device__asn"
          order_weight: 1650
        - name: avd_artifact
          peer: AvdArtifact
          kind: Attribute
          cardinality: one
          optional: true

    - kind: DcimInterface
      attributes:
        - name: description
          kind: Text
          optional: true
          order_weight: 4000
        - name: role
          kind: Dropdown
          optional: true
          choices:
            - name: uplink
              label: Uplink
            - name: access
              label: Access
            - name: spine
              label: Spine
            - name: super_spine
              label: Super Spine
            - name: leaf
              label: Leaf
            - name: loopback
              label: Loopback
            - name: server
              label: Server
            - name: storage
              label: Storage
            - name: mlag_peer
              label: MLAG Peer
              description: "Interface used for MLAG peer-link"
              color: "#d4a9e6"
          order_weight: 3000
        - name: mtu
          label: MTU
          kind: Number
          optional: true
          order_weight: 5000
        - name: index
          kind: Text
          read_only: true
          optional: true
          computed_attribute:
            jinja2_template: "{{ \"%03d\"| format(name__value | split_interface | last | int) }}"
            kind: Jinja2
          order_weight: 20000
      relationships:
        - name: ip_address
          label: IP Address
          peer: IpamIPAddress
          kind: Attribute
          cardinality: one
          optional: true
          identifier: interface__ip_address
          order_weight: 6000

    - kind: DcimConnector
      attributes:
        - name: name
          kind: Text
          unique: true
          optional: false
        - name: medium
          label: Medium
          kind: Dropdown
          optional: false
          choices:
            - name: mmf
              label: Multi-Mode Fibre
            - name: smf
              label: Single-Mode Fibre
            - name: copper
              label: Copper
