---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

nodes:
  - name: Tag
    namespace: Avd
    description: "AVD fabric tag assigned to racks and SVIs"
    label: AVD Tag
    icon: mdi:tag-outline
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        unique: true
        order_weight: 100
      - name: description
        kind: Text
        optional: true
        order_weight: 200
    relationships:
      - name: racks
        peer: LocationRack
        kind: Attribute
        cardinality: many
        optional: false
        identifier: "rack__avd_tags"
        order_weight: 300

  - name: Evpn
    namespace: Avd
    display_label: name__value
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        order_weight: 100
      - name: ebgp_multihop
        label: eBGP Multihop
        kind: Number
        optional: true
        order_weight: 1000
      - name: overlay_bgp_rtc
        label: Overlay BGP RTC
        kind: Boolean
        optional: true
        default_value: false
        order_weight: 2000
    relationships:
      - name: fabric
        peer: NetworkFabric
        kind: Attribute
        cardinality: many
