# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
---
version: "1.0"
generics:
  - name: BuildingBlock
    namespace: Network
    hierarchical: true
    display_label: name__value
    include_in_menu: false
    attributes:
      - name: name
        kind: Text
        unique: true
        branch: aware
        order_weight: 100
      - name: index
        kind: Number
        branch: agnostic
        order_weight: 50000

nodes:
  - name: Fabric
    namespace: Network
    branch: agnostic
    inherit_from:
      - CoreArtifactTarget
      - NetworkBuildingBlock
    parent: ""
    children: NetworkPod
    include_in_menu: false
    attributes:
      - name: fabric_interface_sorting_method
        kind: Dropdown
        branch: aware
        choices:
          - name: create_sorted_device_interface_map
            color: "#869FB3"
          - name: create_reverse_sorted_device_interface_map
            color: "#004E64"
        default_value: create_sorted_device_interface_map
        order_weight: 2000
      - name: spine_interface_sorting_method
        kind: Dropdown
        branch: aware
        choices:
          - name: create_sorted_device_interface_map
            color: "#869FB3"
          - name: create_reverse_sorted_device_interface_map
            color: "#004E64"
        default_value: create_sorted_device_interface_map
        order_weight: 3000
      - name: mgmt_gateway
        label: Management Gateway
        kind: Text
        optional: true
        order_weight: 5000
      - name: mgmt_routes
        label: Management Route
        kind: List
        optional: true
        order_weight: 9000
      - name: avd_hostvars_ready
        kind: Boolean
        optional: true
        default_value: false
        branch: aware
      - name: cloudvision_managed
        label: CloudVision Managed
        kind: Boolean
        optional: false
        default_value: false
        branch: aware
        order_weight: 4100
    relationships:
      - name: asn_pool
        label: BGP ASN Pool
        peer: CoreNumberPool
        branch: aware
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "fabric__asn_pool"
        order_weight: 6000
      - name: node_id_pool
        label: Node ID Pool
        peer: CoreNumberPool
        branch: aware
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "fabric__node_id_pool"
        order_weight: 7000
      - name: mgmt_pool
        label: Management IP Pool
        peer: CoreIPAddressPool
        branch: aware
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "fabric__mgmt_pool"
        order_weight: 8000
      - name: avd_evpn
        label: AVD EVPN Settings
        peer: AvdEvpn
        kind: Attribute
        cardinality: one

  - name: Pod
    namespace: Network
    branch: agnostic
    inherit_from:
      - NetworkBuildingBlock
      - GeneratorTarget
    parent: NetworkFabric
    children: ""
    include_in_menu: false
    attributes:
      - name: role
        kind: Dropdown
        branch: aware
        default_value: cpu
        choices:
          - name: fabric
            label: Fabric
          - name: cpu
            label: CPU
          - name: storage
            label: Storage
        optional: false
        order_weight: 2000
      - name: leaf_interface_sorting_method
        branch: aware
        kind: Dropdown
        choices:
          - name: create_sorted_device_interface_map
            color: "#869FB3"
          - name: create_reverse_sorted_device_interface_map
            color: "#004E64"
        default_value: create_sorted_device_interface_map
        order_weight: 3000
      - name: spine_interface_sorting_method
        branch: aware
        kind: Dropdown
        choices:
          - name: create_sorted_device_interface_map
            color: "#869FB3"
          - name: create_reverse_sorted_device_interface_map
            color: "#004E64"
        default_value: create_sorted_device_interface_map
        order_weight: 4000
    relationships:
      - name: racks
        peer: LocationRack
        branch: aware
        cardinality: many
        kind: Generic
        identifier: "rack__pod"
      - name: devices
        peer: DcimDevice
        branch: aware
        kind: Generic
        cardinality: many
        identifier: "pod__device"
      - name: evpn_domain
        label: EVPN Domain
        peer: EvpnDomain
        kind: Attribute
        cardinality: one
        optional: true
        identifier: "evpn_domain__pods"
        description: "Local EVPN domain for this pod"
        order_weight: 1450
