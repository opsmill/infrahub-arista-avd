# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
---
version: "1.0"

nodes:
  - name: Hall
    namespace: Location
    branch: agnostic
    inherit_from:
      - LocationGeneric
    human_friendly_id:
      - name__value
    children: LocationRack
    parent: ""
    include_in_menu: false
    attributes:
      - name: index
        kind: Number
        branch: agnostic

  - name: Rack
    namespace: Location
    branch: agnostic
    inherit_from:
      - LocationGeneric
      - LocationHosting
      - GeneratorTarget
    parent: LocationHall
    children: ""
    human_friendly_id:
      - name__value
    uniqueness_constraints: [["pod", "index__value"]]
    include_in_menu: false
    attributes:
      - name: index
        kind: Number
        branch: agnostic
      - name: rack_type
        kind: Dropdown
        branch: aware
        choices:
          - name: compute
            label: Compute
          - name: storage
            label: Storage
        default_value: compute
      - name: amount_of_leafs
        kind: Number
        branch: aware
        label: Amount of leaf switches
        default_value: 1
        optional: false
        parameters:
          min_value: 1
          max_value: 2
      - name: mlag
        kind: Boolean
        branch: aware
        label: MLAG
        default_value: true
        optional: false
      - name: generation_complete
        kind: Boolean
        optional: true
        default_value: false
    relationships:
      - name: leaf_switch_template
        kind: Attribute
        branch: aware
        peer: CoreObjectTemplate
        cardinality: one
        identifier: "rack__leaf_template"
      - name: pod
        peer: NetworkPod
        branch: aware
        kind: Attribute
        cardinality: one
        optional: false
        identifier: "rack__pod"
      - name: devices
        peer: DcimPhysicalDevice
        branch: aware
        kind: Generic
        cardinality: many
        identifier: "rack__device"
      - name: avd_tags
        label: AVD Tags
        peer: AvdTag
        branch: aware
        kind: Attribute
        cardinality: many
        optional: true
        identifier: "rack__avd_tags"
