---
x-infrahub-custom-build: &infrahub_custom_build
  image: opsmill/infrahub-solution-arista-avd:${INFRAHUB_BASE_VERSION:-1.10.1}
  environment:
    INFRAHUB_GIT_USER_NAME: "infrahub"
    INFRAHUB_GIT_EMAIL: "no-reply@opsmill.com"
    INFRAHUB_GIT_USE_EXPLICIT_MERGE_COMMIT: true
    INFRAHUB_TIMEOUT: 180
    CLOUDVISION_SERVERS: ${CLOUDVISION_SERVERS:-}
    CLOUDVISION_TOKEN: ${CLOUDVISION_TOKEN:-}
    CLOUDVISION_USERNAME: ${CLOUDVISION_USERNAME:-}
    CLOUDVISION_PASSWORD: ${CLOUDVISION_PASSWORD:-}
    CLOUDVISION_VERIFY_CERTS: ${CLOUDVISION_VERIFY_CERTS:-true}
    CLOUDVISION_PROXY_HOST: ${CLOUDVISION_PROXY_HOST:-}
    CLOUDVISION_PROXY_PORT: ${CLOUDVISION_PROXY_PORT:-}
    CLOUDVISION_PROXY_USERNAME: ${CLOUDVISION_PROXY_USERNAME:-}
    CLOUDVISION_PROXY_PASSWORD: ${CLOUDVISION_PROXY_PASSWORD:-}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      INFRAHUB_BASE_VERSION: "${INFRAHUB_BASE_VERSION:-1.10.1}"

services:
  infrahub-server:
    <<: *infrahub_custom_build
  database:
    ports:
      - 7474:7474
      - 7687:7687

  task-manager:
    <<: *infrahub_custom_build
    ports:
      - 4200:4200

  task-worker:
    <<: *infrahub_custom_build
    volumes:
      - ./:/upstream
      - ./src:/opt/local/src

  service-catalog:
    build:
      context: .
      dockerfile: Dockerfile.catalog
    restart: unless-stopped
    depends_on:
      infrahub-server:
        condition: service_healthy
    environment:
      INFRAHUB_ADDRESS: http://infrahub-server:8000
      INFRAHUB_UI_URL: ${INFRAHUB_UI_URL:-http://localhost:8000}
      INFRAHUB_API_TOKEN: ${INFRAHUB_INITIAL_ADMIN_TOKEN:-06438eb2-8019-4776-878c-0941b1f1d1ec}
      DEFAULT_BRANCH: ${INFRAHUB_INITIAL_DEFAULT_BRANCH:-main}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    healthcheck:
      test: python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  semaphore:
    build:
      context: ./semaphore
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: semaphore
      SEMAPHORE_ADMIN_NAME: Admin
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
      SEMAPHORE_FORWARDED_ENV_VARS: '["INFRAHUB_ADDRESS","INFRAHUB_API_TOKEN"]'
      INFRAHUB_ADDRESS: http://infrahub-server:8000
      INFRAHUB_API_TOKEN: ${INFRAHUB_API_TOKEN:-44af444d-3b26-410d-9546-b758657e026c}
    ports:
      - "3000:3000"
    volumes:
      - ./ansible:/opt/semaphore/playbooks
      # Serves two purposes for deploy_clab.yml: it reads the committed
      # ContainerLab bind sources from configs/, and it stages the artifacts it
      # pulls into clab-staging/ (gitignored via lab/.gitignore's `clab-*`), so
      # the pulled files land on the host rather than in the container's
      # writable layer.
      #
      # Writable, and deliberately a single mount rather than a read-only lab/
      # plus a separate staging bind. A separate bind has to exist on the host
      # before the container starts: if it is missing Docker creates it as root
      # and the staging write fails with EACCES, and if it is deleted afterwards
      # the container keeps a stale mountpoint that fails with a far more
      # confusing ENOENT until the container is recreated. Letting the playbook
      # mkdir the directory under an existing mount removes both failure modes
      # and the pre-creation step they needed.
      - ./lab:/opt/semaphore/lab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
