---
# =============================================================================
# DC1 — 2 spines + 2 border leaves + 2 access leaves
# =============================================================================

spine:
  defaults:
    platform: cEOSLab
    bgp_as: 65100
    loopback_ipv4_pool: 10.250.1.0/24
  nodes:
    - name: ih-dc1-spine1
      id: 1
      mgmt_ip: 10.0.6.11/24
    - name: ih-dc1-spine2
      id: 2
      mgmt_ip: 10.0.6.12/24

l3leaf:
  defaults:
    platform: cEOSLab
    virtual_router_mac_address: 00:1c:73:00:00:99
    spanning_tree_priority: 4096
    spanning_tree_mode: mstp
    uplink_switches: [ih-dc1-spine1, ih-dc1-spine2]
    uplink_ipv4_pool: 10.250.3.0/24
    loopback_ipv4_pool: 10.250.1.0/24
    loopback_ipv4_offset: 2
    vtep_loopback_ipv4_pool: 10.250.2.0/24
  node_groups:
    # =========================================================================
    # Border Leaves — EVPN Multi-Domain Gateways (DCI to DC2)
    # =========================================================================
    - group: DC1_BORDER
      mlag: false
      filter:
        tags: [DC1]
      evpn_gateway:
        evpn_l2:
          enabled: true
        evpn_l3:
          enabled: true
          inter_domain: true
        d_path:
          enabled: true
          local_domain_id: "65100:1"
          remote_domain_id: "65200:100"
        all_active_multihoming:
          enabled: true
          evpn_ethernet_segment:
            identifier: "0000:0001:0001:0000:0001"
            rt_import: "00:01:00:00:00:01"
        remote_peers:
          - hostname: ih-dc2-leaf1a
          - hostname: ih-dc2-leaf1b
      nodes:
        - name: ih-dc1-leaf1a
          id: 1
          bgp_as: 65101
          mgmt_ip: 10.0.6.13/24
        - name: ih-dc1-leaf1b
          id: 2
          bgp_as: 65102
          mgmt_ip: 10.0.6.14/24

    # =========================================================================
    # Access Leaves
    # =========================================================================
    - group: DC1_ACCESS
      mlag: false
      filter:
        tags: [DC1]
      nodes:
        - name: ih-dc1-leaf2a
          id: 3
          bgp_as: 65103
          mgmt_ip: 10.0.6.15/24
        - name: ih-dc1-leaf2b
          id: 4
          bgp_as: 65104
          mgmt_ip: 10.0.6.16/24
