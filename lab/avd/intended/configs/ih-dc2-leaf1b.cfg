!
no enable password
no aaa root
aaa authentication policy local allow-nopassword-remote-login
!
username admin privilege 15 role network-admin nopassword
username mtache privilege 15 role network-admin nopassword
!
alias cc clear counters
alias sa show active
alias senz show interface counter error | nz
alias shmc show int | awk '/^[A-Z]/ { intf = $1 } /, address is/ { print intf, $6 }'
alias snz show interface counter | nz
alias sqnz show interface counter queue | nz
alias srnz show interface counter rate | nz

!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname ih-dc2-leaf1b
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 8.8.8.8
!
spanning-tree mode mstp
spanning-tree mst 0 priority 4096
!
clock timezone Europe/Paris
!
vlan 12
   name VRF10_DC2
!
vlan 19
   name VRF10_STRETCHED
!
vrf instance MGMT
!
vrf instance VRF10
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
!
interface Ethernet5
   description P2P_ih-dc1-leaf1b_Ethernet5
   no shutdown
   mtu 1500
   no switchport
   ip address 172.16.0.5/31
!
interface Ethernet6
   description P2P_ih-dc1-leaf1a_Ethernet6
   no shutdown
   mtu 1500
   no switchport
   ip address 172.16.0.3/31
!
interface Ethernet49/1
   description P2P_ih-dc2-spine1_Ethernet2/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.251.3.5/31
!
interface Ethernet50/1
   description P2P_ih-dc2-spine2_Ethernet2/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.251.3.7/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.251.1.4/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.251.2.4/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.0.6.24/24
   no lldp transmit
   no lldp receive
!
interface Vlan12
   description VRF10_DC2
   no shutdown
   vrf VRF10
   ip address virtual 10.10.12.1/24
!
interface Vlan19
   description VRF10_STRETCHED
   no shutdown
   vrf VRF10
   ip address virtual 10.10.19.1/24
!
interface Vxlan1
   description ih-dc2-leaf1b_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 12 vni 10012
   vxlan vlan 19 vni 10019
   vxlan vrf VRF10 vni 10
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF10
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.251.1.0/24 eq 32
   seq 20 permit 10.251.2.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 10.0.6.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT time.google.com prefer
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65202
   router-id 10.251.1.4
   no bgp default ipv4-unicast
   graceful-restart restart-time 300
   graceful-restart
   maximum-paths 4
   bgp bestpath d-path
   neighbor EVPN-OVERLAY-CORE peer group
   neighbor EVPN-OVERLAY-CORE update-source Loopback0
   neighbor EVPN-OVERLAY-CORE bfd
   neighbor EVPN-OVERLAY-CORE ebgp-multihop 3
   neighbor EVPN-OVERLAY-CORE send-community
   neighbor EVPN-OVERLAY-CORE maximum-routes 0
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.250.1.3 peer group EVPN-OVERLAY-CORE
   neighbor 10.250.1.3 remote-as 65101
   neighbor 10.250.1.3 description ih-dc1-leaf1a_Loopback0
   neighbor 10.250.1.4 peer group EVPN-OVERLAY-CORE
   neighbor 10.250.1.4 remote-as 65102
   neighbor 10.250.1.4 description ih-dc1-leaf1b_Loopback0
   neighbor 10.251.1.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.251.1.1 remote-as 65200
   neighbor 10.251.1.1 description ih-dc2-spine1_Loopback0
   neighbor 10.251.1.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.251.1.2 remote-as 65200
   neighbor 10.251.1.2 description ih-dc2-spine2_Loopback0
   neighbor 10.251.3.4 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.251.3.4 remote-as 65200
   neighbor 10.251.3.4 description ih-dc2-spine1_Ethernet2/1
   neighbor 10.251.3.6 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.251.3.6 remote-as 65200
   neighbor 10.251.3.6 description ih-dc2-spine2_Ethernet2/1
   neighbor 172.16.0.2 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.0.2 remote-as 65101
   neighbor 172.16.0.2 description ih-dc1-leaf1a
   neighbor 172.16.0.4 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.0.4 remote-as 65102
   neighbor 172.16.0.4 description ih-dc1-leaf1b
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 12
      rd 10.251.1.4:10012
      rd evpn domain remote 10.251.1.4:10012
      route-target both 10012:10012
      route-target import export evpn domain remote 10012:10012
      redistribute learned
   !
   vlan 19
      rd 10.251.1.4:10019
      rd evpn domain remote 10.251.1.4:10019
      route-target both 10019:10019
      route-target import export evpn domain remote 10019:10019
      redistribute learned
   !
   address-family evpn
      route export ethernet-segment ip mass-withdraw
      route import ethernet-segment ip mass-withdraw
      neighbor EVPN-OVERLAY-CORE activate
      neighbor EVPN-OVERLAY-CORE domain remote
      neighbor EVPN-OVERLAY-PEERS activate
      domain identifier 65200:100
      domain identifier 65100:1 remote
      neighbor default next-hop-self received-evpn-routes route-type ip-prefix inter-domain
      layer-2 fec in-place update
      !
      evpn ethernet-segment domain all
         identifier 0000:0002:0002:0000:0002
         route-target import 00:02:00:00:00:02
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-CORE activate
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf VRF10
      rd 10.251.1.4:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 10.251.1.4
      redistribute connected
!
platform tfa
  interface mode relaying

!
end
