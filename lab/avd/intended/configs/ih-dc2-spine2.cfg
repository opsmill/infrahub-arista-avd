!
no enable password
no aaa root
aaa authentication policy local allow-nopassword-remote-login
!
username admin privilege 15 role network-admin nopassword
username mtache privilege 15 role network-admin nopassword
!
alias cc clear counters
alias sa show active
alias senz show interface counter error | nz
alias shmc show int | awk '/^[A-Z]/ { intf = $1 } /, address is/ { print intf, $6 }'
alias snz show interface counter | nz
alias sqnz show interface counter queue | nz
alias srnz show interface counter rate | nz

!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname ih-dc2-spine2
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 8.8.8.8
!
spanning-tree mode none
!
clock timezone Europe/Paris
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
!
interface Ethernet1/1
   description P2P_ih-dc2-leaf1a_Ethernet50/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.251.3.2/31
!
interface Ethernet2/1
   description P2P_ih-dc2-leaf1b_Ethernet50/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.251.3.6/31
!
interface Ethernet3/1
   description P2P_ih-dc2-leaf2a_Ethernet50/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.251.3.10/31
!
interface Ethernet4/1
   description P2P_ih-dc2-leaf2b_Ethernet50/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.251.3.14/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.251.1.2/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.0.6.22/24
   no lldp transmit
   no lldp receive
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.251.1.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 10.0.6.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT time.google.com prefer
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65200
   router-id 10.251.1.2
   no bgp default ipv4-unicast
   graceful-restart restart-time 300
   graceful-restart
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.251.1.3 peer group EVPN-OVERLAY-PEERS
   neighbor 10.251.1.3 remote-as 65201
   neighbor 10.251.1.3 description ih-dc2-leaf1a_Loopback0
   neighbor 10.251.1.4 peer group EVPN-OVERLAY-PEERS
   neighbor 10.251.1.4 remote-as 65202
   neighbor 10.251.1.4 description ih-dc2-leaf1b_Loopback0
   neighbor 10.251.1.5 peer group EVPN-OVERLAY-PEERS
   neighbor 10.251.1.5 remote-as 65203
   neighbor 10.251.1.5 description ih-dc2-leaf2a_Loopback0
   neighbor 10.251.1.6 peer group EVPN-OVERLAY-PEERS
   neighbor 10.251.1.6 remote-as 65204
   neighbor 10.251.1.6 description ih-dc2-leaf2b_Loopback0
   neighbor 10.251.3.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.251.3.3 remote-as 65201
   neighbor 10.251.3.3 description ih-dc2-leaf1a_Ethernet50/1
   neighbor 10.251.3.7 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.251.3.7 remote-as 65202
   neighbor 10.251.3.7 description ih-dc2-leaf1b_Ethernet50/1
   neighbor 10.251.3.11 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.251.3.11 remote-as 65203
   neighbor 10.251.3.11 description ih-dc2-leaf2a_Ethernet50/1
   neighbor 10.251.3.15 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.251.3.15 remote-as 65204
   neighbor 10.251.3.15 description ih-dc2-leaf2b_Ethernet50/1
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      route export ethernet-segment ip mass-withdraw
      route import ethernet-segment ip mass-withdraw
      neighbor EVPN-OVERLAY-PEERS activate
      layer-2 fec in-place update
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
!
platform tfa
  interface mode relaying

!
end
