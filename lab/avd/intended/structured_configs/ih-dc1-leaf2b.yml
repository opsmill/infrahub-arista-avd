aaa_authentication:
  policies:
    local:
      allow_nopassword: true
aaa_root:
  disabled: true
aliases: 'alias cc clear counters

  alias sa show active

  alias senz show interface counter error | nz

  alias shmc show int | awk ''/^[A-Z]/ { intf = $1 } /, address is/ { print intf, $6 }''

  alias snz show interface counter | nz

  alias sqnz show interface counter queue | nz

  alias srnz show interface counter rate | nz

  '
clock:
  timezone: Europe/Paris
config_end: true
enable_password:
  disabled: true
eos_cli: "platform tfa\n  interface mode relaying\n"
ethernet_interfaces:
- name: Ethernet49/1
  description: P2P_ih-dc1-spine1_Ethernet4/1
  shutdown: false
  mtu: 1500
  ip_address: 10.250.3.13/31
  metadata:
    peer: ih-dc1-spine1
    peer_interface: Ethernet4/1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet50/1
  description: P2P_ih-dc1-spine2_Ethernet4/1
  shutdown: false
  mtu: 1500
  ip_address: 10.250.3.15/31
  metadata:
    peer: ih-dc1-spine2
    peer_interface: Ethernet4/1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet1
  description: SERVER_dc1-server1_eth2
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: dc1-server1
    peer_interface: eth2
    peer_type: server
    peer_key: servers
    port_profile: server
hostname: ih-dc1-leaf2b
ip_domain_lookup:
  source_interfaces:
  - name: Management1
    vrf: MGMT
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 8.8.8.8
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
local_users:
- name: admin
  privilege: 15
  role: network-admin
  no_password: true
- name: mtache
  privilege: 15
  role: network-admin
  no_password: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.250.1.6/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.250.2.6/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 10.0.6.16/24
  type: oob
  gateway: 10.0.6.1
  lldp:
    transmit: false
    receive: false
metadata:
  is_deployed: true
  platform: cEOSLab
  pod_name: DC1_POD1
  dc_name: DC1
  fabric_name: INFRAHUB_AVD
  serial_number: INFRAHUB006
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: DC1
    - name: topology_hint_fabric
      value: INFRAHUB_AVD
    - name: topology_hint_pod
      value: DC1_POD1
    - name: topology_hint_type
      value: leaf
    - name: topology_hint_rack
      value: DC1_ACCESS
    - name: Lab
      value: Infrahub AVD
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: time.google.com
    preferred: true
  vrf: MGMT
port_channel_interfaces:
- name: Port-Channel1
  description: dc1-server1
  shutdown: false
  evpn_ethernet_segment:
    identifier: 0000:0000:a4dc:fe78:228f
    route_target: a4:dc:fe:78:22:8f
  lacp_id: a4dc.fe78.228f
  spanning_tree_portfast: edge
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 11,19
      native_vlan: 4092
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.250.1.0/24 eq 32
  - sequence: 20
    action: permit 10.250.2.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65104'
  router_id: 10.250.1.6
  graceful_restart:
    enabled: true
    restart_time: 300
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.250.3.12
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: ih-dc1-spine1
    description: ih-dc1-spine1_Ethernet4/1
  - ip_address: 10.250.3.14
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: ih-dc1-spine2
    description: ih-dc1-spine2_Ethernet4/1
  - ip_address: 10.250.1.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: ih-dc1-spine1
    description: ih-dc1-spine1_Loopback0
  - ip_address: 10.250.1.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: ih-dc1-spine2
    description: ih-dc1-spine2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 11
    metadata:
      tenants:
      - Arista
    rd: 10.250.1.6:10011
    route_targets:
      both:
      - 10011:10011
    redistribute_routes:
    - learned
  - id: 19
    metadata:
      tenants:
      - Arista
    rd: 10.250.1.6:10019
    route_targets:
      both:
      - 10019:10019
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
    route:
      import_ethernet_segment_ip_mass_withdraw: true
      export_ethernet_segment_ip_mass_withdraw: true
    layer_2_fec_in_place_update:
      enabled: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: VRF10
    rd: 10.250.1.6:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 10.250.1.6
    redistribute:
      connected:
        enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 4096
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 10.0.6.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan11
  description: VRF10_DC1
  shutdown: false
  vrf: VRF10
  ip_address_virtual: 10.10.11.1/24
  metadata:
    tenants:
    - Arista
    tags:
    - DC1
- name: Vlan19
  description: VRF10_STRETCHED
  shutdown: false
  vrf: VRF10
  ip_address_virtual: 10.10.19.1/24
  metadata:
    tenants:
    - Arista
    tags:
    - DC1
    - DC2
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 11
  name: VRF10_DC1
  metadata:
    tenants:
    - Arista
- id: 19
  name: VRF10_STRETCHED
  metadata:
    tenants:
    - Arista
vrfs:
- name: MGMT
  ip_routing: false
- name: VRF10
  ip_routing: true
  metadata:
    tenants:
    - Arista
vxlan_interface:
  vxlan1:
    description: ih-dc1-leaf2b_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 11
        vni: 10011
      - id: 19
        vni: 10019
      vrfs:
      - name: VRF10
        vni: 10
