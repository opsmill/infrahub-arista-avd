aaa_authentication:
  policies:
    local:
      allow_nopassword: true
aaa_root:
  disabled: true
aliases: 'alias cc clear counters

  alias sa show active

  alias senz show interface counter error | nz

  alias shmc show int | awk ''/^[A-Z]/ { intf = $1 } /, address is/ { print intf, $6 }''

  alias snz show interface counter | nz

  alias sqnz show interface counter queue | nz

  alias srnz show interface counter rate | nz

  '
clock:
  timezone: Europe/Paris
config_end: true
enable_password:
  disabled: true
eos_cli: "platform tfa\n  interface mode relaying\n"
ethernet_interfaces:
- name: Ethernet49/1
  description: P2P_ih-dc1-spine1_Ethernet1/1
  shutdown: false
  mtu: 1500
  ip_address: 10.250.3.1/31
  metadata:
    peer: ih-dc1-spine1
    peer_interface: Ethernet1/1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet50/1
  description: P2P_ih-dc1-spine2_Ethernet1/1
  shutdown: false
  mtu: 1500
  ip_address: 10.250.3.3/31
  metadata:
    peer: ih-dc1-spine2
    peer_interface: Ethernet1/1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet5
  description: P2P_ih-dc2-leaf1a_Ethernet5
  shutdown: false
  mtu: 1500
  ip_address: 172.16.0.0/31
  metadata:
    peer: ih-dc2-leaf1a
    peer_interface: Ethernet5
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet6
  description: P2P_ih-dc2-leaf1b_Ethernet6
  shutdown: false
  mtu: 1500
  ip_address: 172.16.0.2/31
  metadata:
    peer: ih-dc2-leaf1b
    peer_interface: Ethernet6
    peer_type: l3leaf
  switchport:
    enabled: false
hostname: ih-dc1-leaf1a
ip_domain_lookup:
  source_interfaces:
  - name: Management1
    vrf: MGMT
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 8.8.8.8
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
local_users:
- name: admin
  privilege: 15
  role: network-admin
  no_password: true
- name: mtache
  privilege: 15
  role: network-admin
  no_password: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.250.1.3/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.250.2.3/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 10.0.6.13/24
  type: oob
  gateway: 10.0.6.1
  lldp:
    transmit: false
    receive: false
metadata:
  is_deployed: true
  platform: cEOSLab
  pod_name: DC1_POD1
  dc_name: DC1
  fabric_name: INFRAHUB_AVD
  serial_number: INFRAHUB003
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: DC1
    - name: topology_hint_fabric
      value: INFRAHUB_AVD
    - name: topology_hint_pod
      value: DC1_POD1
    - name: topology_hint_type
      value: leaf
    - name: topology_hint_rack
      value: DC1_BORDER
    - name: Lab
      value: Infrahub AVD
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: time.google.com
    preferred: true
  vrf: MGMT
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.250.1.0/24 eq 32
  - sequence: 20
    action: permit 10.250.2.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 10.250.1.3
  graceful_restart:
    enabled: true
    restart_time: 300
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
    bestpath:
      d_path: true
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  - name: EVPN-OVERLAY-CORE
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.250.3.0
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: ih-dc1-spine1
    description: ih-dc1-spine1_Ethernet1/1
  - ip_address: 10.250.3.2
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: ih-dc1-spine2
    description: ih-dc1-spine2_Ethernet1/1
  - ip_address: 10.250.1.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: ih-dc1-spine1
    description: ih-dc1-spine1_Loopback0
  - ip_address: 10.250.1.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: ih-dc1-spine2
    description: ih-dc1-spine2_Loopback0
  - ip_address: 10.251.1.3
    peer_group: EVPN-OVERLAY-CORE
    remote_as: '65201'
    metadata:
      peer: ih-dc2-leaf1a
    description: ih-dc2-leaf1a_Loopback0
  - ip_address: 10.251.1.4
    peer_group: EVPN-OVERLAY-CORE
    remote_as: '65202'
    metadata:
      peer: ih-dc2-leaf1b
    description: ih-dc2-leaf1b_Loopback0
  - ip_address: 172.16.0.1
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65201'
    metadata:
      peer: ih-dc2-leaf1a
    description: ih-dc2-leaf1a
  - ip_address: 172.16.0.3
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65202'
    metadata:
      peer: ih-dc2-leaf1b
    description: ih-dc2-leaf1b
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 11
    metadata:
      tenants:
      - Arista
    rd: 10.250.1.3:10011
    rd_evpn_domain:
      domain: remote
      rd: 10.250.1.3:10011
    route_targets:
      both:
      - 10011:10011
      import_export_evpn_domains:
      - domain: remote
        route_target: 10011:10011
    redistribute_routes:
    - learned
  - id: 19
    metadata:
      tenants:
      - Arista
    rd: 10.250.1.3:10019
    rd_evpn_domain:
      domain: remote
      rd: 10.250.1.3:10019
    route_targets:
      both:
      - 10019:10019
      import_export_evpn_domains:
      - domain: remote
        route_target: 10019:10019
    redistribute_routes:
    - learned
  address_family_evpn:
    domain_identifier: '65100:1'
    domain_identifier_remote: 65200:100
    neighbor_default:
      next_hop_self_received_evpn_routes:
        enable: true
        inter_domain: true
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-CORE
      activate: true
      domain_remote: true
    route:
      import_ethernet_segment_ip_mass_withdraw: true
      export_ethernet_segment_ip_mass_withdraw: true
    layer_2_fec_in_place_update:
      enabled: true
    evpn_ethernet_segment:
    - domain: all
      identifier: 0000:0001:0001:0000:0001
      route_target_import: 00:01:00:00:00:01
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
    - name: EVPN-OVERLAY-CORE
      activate: false
  vrfs:
  - name: VRF10
    rd: 10.250.1.3:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 10.250.1.3
    redistribute:
      connected:
        enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 4096
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 10.0.6.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan11
  description: VRF10_DC1
  shutdown: false
  vrf: VRF10
  ip_address_virtual: 10.10.11.1/24
  metadata:
    tenants:
    - Arista
    tags:
    - DC1
- name: Vlan19
  description: VRF10_STRETCHED
  shutdown: false
  vrf: VRF10
  ip_address_virtual: 10.10.19.1/24
  metadata:
    tenants:
    - Arista
    tags:
    - DC1
    - DC2
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 11
  name: VRF10_DC1
  metadata:
    tenants:
    - Arista
- id: 19
  name: VRF10_STRETCHED
  metadata:
    tenants:
    - Arista
vrfs:
- name: MGMT
  ip_routing: false
- name: VRF10
  ip_routing: true
  metadata:
    tenants:
    - Arista
vxlan_interface:
  vxlan1:
    description: ih-dc1-leaf1a_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 11
        vni: 10011
      - id: 19
        vni: 10019
      vrfs:
      - name: VRF10
        vni: 10
