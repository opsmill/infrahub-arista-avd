aaa_authentication:
  policies:
    local:
      allow_nopassword: true
aaa_root:
  disabled: true
aliases: 'alias cc clear counters

  alias sa show active

  alias senz show interface counter error | nz

  alias shmc show int | awk ''/^[A-Z]/ { intf = $1 } /, address is/ { print intf, $6 }''

  alias snz show interface counter | nz

  alias sqnz show interface counter queue | nz

  alias srnz show interface counter rate | nz

  '
clock:
  timezone: Europe/Paris
config_end: true
enable_password:
  disabled: true
eos_cli: "platform tfa\n  interface mode relaying\n"
ethernet_interfaces:
- name: Ethernet1/1
  description: P2P_ih-dc2-leaf1a_Ethernet49/1
  shutdown: false
  mtu: 1500
  ip_address: 10.251.3.0/31
  metadata:
    peer: ih-dc2-leaf1a
    peer_interface: Ethernet49/1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet2/1
  description: P2P_ih-dc2-leaf1b_Ethernet49/1
  shutdown: false
  mtu: 1500
  ip_address: 10.251.3.4/31
  metadata:
    peer: ih-dc2-leaf1b
    peer_interface: Ethernet49/1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet3/1
  description: P2P_ih-dc2-leaf2a_Ethernet49/1
  shutdown: false
  mtu: 1500
  ip_address: 10.251.3.8/31
  metadata:
    peer: ih-dc2-leaf2a
    peer_interface: Ethernet49/1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet4/1
  description: P2P_ih-dc2-leaf2b_Ethernet49/1
  shutdown: false
  mtu: 1500
  ip_address: 10.251.3.12/31
  metadata:
    peer: ih-dc2-leaf2b
    peer_interface: Ethernet49/1
    peer_type: l3leaf
  switchport:
    enabled: false
hostname: ih-dc2-spine1
ip_domain_lookup:
  source_interfaces:
  - name: Management1
    vrf: MGMT
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 8.8.8.8
ip_routing: true
local_users:
- name: admin
  privilege: 15
  role: network-admin
  no_password: true
- name: mtache
  privilege: 15
  role: network-admin
  no_password: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.251.1.1/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 10.0.6.21/24
  type: oob
  gateway: 10.0.6.1
  lldp:
    transmit: false
    receive: false
metadata:
  is_deployed: true
  platform: cEOSLab
  pod_name: DC2_POD1
  dc_name: DC2
  fabric_name: INFRAHUB_AVD
  serial_number: INFRAHUB011
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: DC2
    - name: topology_hint_fabric
      value: INFRAHUB_AVD
    - name: topology_hint_pod
      value: DC2_POD1
    - name: topology_hint_type
      value: spine
    - name: Lab
      value: Infrahub AVD
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: time.google.com
    preferred: true
  vrf: MGMT
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.251.1.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65200'
  router_id: 10.251.1.1
  graceful_restart:
    enabled: true
    restart_time: 300
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    next_hop_unchanged: true
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.251.3.1
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65201'
    metadata:
      peer: ih-dc2-leaf1a
    description: ih-dc2-leaf1a_Ethernet49/1
  - ip_address: 10.251.3.5
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65202'
    metadata:
      peer: ih-dc2-leaf1b
    description: ih-dc2-leaf1b_Ethernet49/1
  - ip_address: 10.251.3.9
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65203'
    metadata:
      peer: ih-dc2-leaf2a
    description: ih-dc2-leaf2a_Ethernet49/1
  - ip_address: 10.251.3.13
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65204'
    metadata:
      peer: ih-dc2-leaf2b
    description: ih-dc2-leaf2b_Ethernet49/1
  - ip_address: 10.251.1.3
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65201'
    metadata:
      peer: ih-dc2-leaf1a
    description: ih-dc2-leaf1a_Loopback0
  - ip_address: 10.251.1.4
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65202'
    metadata:
      peer: ih-dc2-leaf1b
    description: ih-dc2-leaf1b_Loopback0
  - ip_address: 10.251.1.5
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65203'
    metadata:
      peer: ih-dc2-leaf2a
    description: ih-dc2-leaf2a_Loopback0
  - ip_address: 10.251.1.6
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65204'
    metadata:
      peer: ih-dc2-leaf2b
    description: ih-dc2-leaf2b_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
    route:
      import_ethernet_segment_ip_mass_withdraw: true
      export_ethernet_segment_ip_mass_withdraw: true
    layer_2_fec_in_place_update:
      enabled: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 10.0.6.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
