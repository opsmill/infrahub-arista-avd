[project]
name = "labs"
version = "0"
description = "Arista network lab environments (containerlab + AVD)"
requires-python = "==3.12.*"
dependencies = [
    # AVD pipeline
    "ansible",
    "ansible-pylibssh",
    "pyavd[ansible]",
    "anta[cli]",
    "eos-downloader",
    # Infrahub flow (../ansible/deploy_clab.yml). The opsmill.infrahub modules are
    # action plugins that import infrahub_sdk in the Ansible controller's
    # interpreter, so without this they fail with "infrahub_sdk must be installed
    # to use this plugin". The collection itself is installed separately with
    # `ansible-galaxy collection install -r ../ansible/requirements.yml`.
    "infrahub-sdk",
]

[tool.uv]
# Force uv-managed Python interpreters so the venv doesn't bind to a
# user-installed Python (pyenv, Homebrew, etc.) that could be removed.
python-preference = "only-managed"
