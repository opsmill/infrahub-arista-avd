---
# Pull a fabric's ContainerLab topology (and the files it references) from
# Infrahub, then deploy the lab with ContainerLab.
#
# Usage (from the lab/ directory, on a ContainerLab-capable host):
#   uv run ansible-playbook playbooks/deploy_clab.yml -e fabric=Fabric-A
#
# Requirements on the lab host:
#   - opsmill.infrahub collection   (ansible-galaxy collection install opsmill.infrahub)
#   - containerlab                  (https://containerlab.dev)
#   - INFRAHUB_ADDRESS / INFRAHUB_API_TOKEN in the environment
#
# NOTE: the exact opsmill.infrahub module/plugin names should be confirmed
# against the installed collection version (`ansible-doc -l opsmill.infrahub`).
# This playbook targets `opsmill.infrahub.artifact_fetch`; adjust if your
# collection version differs.

- name: Deploy a fabric as a ContainerLab topology
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Mandatory: the play fails with the hint below if -e fabric=... is not set.
    fabric: "{{ undef(hint='Set the fabric name, e.g. -e fabric=Fabric-A') }}"
    lab_dir: "{{ playbook_dir }}/.."
    topology_file: "{{ lab_dir }}/topology.clab.yml"
    config_dir: "{{ lab_dir }}/configs"
  tasks:
    - name: Fetch the ContainerLab Topology artifact from Infrahub
      opsmill.infrahub.artifact_fetch:
        artifact_name: "ContainerLab Topology"
        target_id: "{{ fabric }}"
      register: clab_topology

    - name: Write the topology file to the lab directory
      ansible.builtin.copy:
        content: "{{ clab_topology.text | default(clab_topology.content) }}"
        dest: "{{ topology_file }}"
        mode: "0644"

    - name: Ensure the config output directory exists
      ansible.builtin.file:
        path: "{{ config_dir }}"
        state: directory
        mode: "0755"

    - name: Discover the fabric's devices
      opsmill.infrahub.query_graphql:
        query: |
          query($name: String!) {
            NetworkFabric(name__value: $name) { edges { node {
              children { edges { node { ... on NetworkPod {
                devices { edges { node { ... on DcimDevice { name { value } } } } }
                racks { edges { node { devices { edges { node { ... on DcimDevice { name { value } } } } } } } }
              } } } }
            } } }
          }
        variables:
          name: "{{ fabric }}"
      register: fabric_devices

    - name: Collect device names
      ansible.builtin.set_fact:
        device_names: >-
          {{
            (fabric_devices.results.NetworkFabric.edges[0].node.children.edges
             | map(attribute='node') | list | json_query('[].devices.edges[].node.name.value'))
            +
            (fabric_devices.results.NetworkFabric.edges[0].node.children.edges
             | map(attribute='node') | list | json_query('[].racks.edges[].node.devices.edges[].node.name.value'))
          }}

    - name: Fetch each device's AVD EOS Configuration artifact (startup-config)
      opsmill.infrahub.artifact_fetch:
        artifact_name: "AVD EOS Configuration"
        target_id: "{{ item }}"
      loop: "{{ device_names | unique }}"
      register: device_configs

    - name: Write per-device startup configs
      ansible.builtin.copy:
        content: "{{ item.text | default(item.content) }}"
        dest: "{{ config_dir }}/{{ item.item }}.cfg"
        mode: "0644"
      loop: "{{ device_configs.results }}"
      loop_control:
        label: "{{ item.item }}"

    # NOTE: per-device-type EosIntfMapping.json binds are planned for a later
    # schema cycle (CoreFileObject on DcimDeviceType). When that lands, add a
    # step here to fetch those files from Infrahub into configs/eos-intf-mapping/.

    - name: Deploy the lab with ContainerLab
      ansible.builtin.command:
        cmd: containerlab deploy --reconfigure --topo {{ topology_file }}
      register: clab_deploy
      changed_when: true

    - name: Report deployment result
      ansible.builtin.debug:
        msg: "{{ clab_deploy.stdout_lines | default([]) }}"
